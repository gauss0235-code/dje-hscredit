# 공동교육과정 만족도 조사: 설문별 공유 페이지(survey/<주소용 코드>/index.html) 자동 갱신
# 카카오톡 링크 미리보기에 설문 제목이 뜨게 하려고, 관리자가 만든 설문마다 제목이 들어간 페이지를 만들어 둔다.
# 할 일: Supabase 설문 목록 읽기 → tools/survey_share_pages.py 실행 → 바뀐 게 있을 때만 커밋·푸시
#        → 아직 배포되지 않은 커밋이 있으면 사이트 다시 배포 요청
# 직접 실행: GitHub 저장소 → Actions → "설문 공유 페이지 갱신" → Run workflow
# 60일 규칙: 공개 저장소는 60일 동안 변화가 없으면 정기 실행이 멈추므로, 실행할 때마다 '사용함'을 다시 걸어 둠(keepalive).
#           그래도 멈춰 있으면 Actions 화면에서 'Enable workflow'를 한 번 누르면 됨
name: 설문 공유 페이지 갱신

on:
  schedule:
    - cron: "7,22,37,52 * * * *"   # 15분마다(정각을 피함). GitHub 사정으로 몇 분 늦어질 수 있음
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "survey/index.html"
      - "survey/assets/config.js"
      - "tools/**"

permissions:
  contents: write   # 공유 페이지 커밋·푸시
  pages: write      # 사이트 다시 배포 요청 (GITHUB_TOKEN으로 푸시한 커밋은 Pages 배포를 일으키지 않음)
  actions: write    # keepalive: 이 작업을 '사용함'으로 다시 걸어 60일 비활성 타이머를 초기화

concurrency:
  group: survey-share-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: keepalive (60일 뒤 정기 실행이 멈추지 않게)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/survey-share-pages.yml/enable"

      - name: 설문별 공유 페이지·미리보기 이미지 만들기 (이미지는 러너에 설치된 크롬으로 찍음)
        run: python3 tools/survey_share_pages.py

      - name: 바뀐 것이 있으면 커밋·푸시
        run: |
          git add -A survey
          if git diff --cached --quiet; then
            echo "바뀐 페이지 없음"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "설문 공유 페이지 자동 갱신"
          for i in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              exit 0
            fi
            sleep 5
          done
          exit 1

      # 이번 실행에서 푸시했는지가 아니라 '만든 결과가 실제 사이트에 올라갔는지'를 보고 요청함:
      # survey/assets/share-stamp.txt(만든 결과의 지문)를 실제 사이트의 같은 파일과 비교.
      # 그래서 요청이나 배포가 한 번 실패해도 다음 실행에서 다시 요청되고, 이미 올라갔으면 아무것도 안 함
      - name: 사이트에 아직 안 올라갔으면 다시 배포 요청
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          base=$(grep -o 'SURVEY_BASE_URL: *"[^"]*"' survey/assets/config.js | sed 's/.*"\(.*\)"/\1/')
          want=$(cat survey/assets/share-stamp.txt)
          live=$(curl -fsS --max-time 20 "${base%/}/assets/share-stamp.txt?t=$(date +%s)" || echo none)
          echo "만든 결과 $want / 사이트 $live"
          if [ "$want" = "$live" ]; then
            echo "이미 사이트에 올라가 있음"
            exit 0
          fi
          for i in 1 2 3; do
            if gh api -X POST "repos/${{ github.repository }}/pages/builds"; then
              exit 0
            fi
            sleep 10
          done
          exit 1
