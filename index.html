<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>대전광역시 고등학교 교육과정 | 한눈에 살펴보기</title>
<meta name="description" content="대전광역시 고등학교 교육과정 편성표 및 과목 선택 시뮬레이터를 한곳에서 확인할 수 있는 사이트입니다.">

<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<link rel="preload" href="https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_231029@1.1/JalnanGothic.woff" as="font" type="font/woff" crossorigin>

<style>
@font-face {
  font-family: 'YeogiOttaeJalnanGothic';
  src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_231029@1.1/JalnanGothic.woff') format('woff');
  font-weight: normal;
  font-style: normal;
  font-display: block;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --sky-blue: #7BB6E0;
  --sky-blue-dark: #4A8AB8;
  --cream: #FFF8E7;
  --beige-base: #F7F1E3;
  --beige-hover: #FFE6BD;
  --text-dark: #2C3E50;
  --text-mid: #5A6C7D;
  --text-brown: #5C4530;
  --accent-yellow: #FFC93C;
  --accent-coral: #FF8C94;
  --accent-mint: #7DBE7C;
  --accent-rose: #D4537E;
}

html { scroll-behavior: smooth; }

body {
  font-family: 'Pretendard', sans-serif;
  background: linear-gradient(180deg, #B8DDF5 0%, #C8E2F4 30%, #D8EBF5 60%, #E8F4FB 100%);
  background-attachment: fixed;
  color: var(--text-dark);
  line-height: 1.6;
  overflow-x: hidden;
  min-height: 100vh;
}

h1, h2 {
  font-family: 'YeogiOttaeJalnanGothic', 'Pretendard', sans-serif !important;
  font-weight: normal;
}

.hero {
  position: relative;
  padding: 50px 20px 30px;
}

.hero-bg-clip {
  position: absolute;
  inset: 0;
  overflow: hidden;
  pointer-events: none;
  z-index: 1;
}
.hero-inner {
  max-width: 1200px;
  margin: 0 auto;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 40px;
  align-items: center;
  position: relative;
  z-index: 2;
}
.hero-eyebrow {
  display: inline-block;
  background: var(--sky-blue-dark);
  color: white;
  padding: 6px 16px;
  border-radius: 20px;
  font-size: 0.95em;
  font-weight: 700;
  margin-bottom: 20px;
}
.hero h1 {
  font-size: 2.6em;
  line-height: 1.3;
  color: var(--text-dark);
  margin-bottom: 20px;
  letter-spacing: -0.02em;
}
.hero h1 .highlight {
  color: var(--sky-blue-dark);
  position: relative;
}
.hero h1 .highlight::after {
  content: '';
  position: absolute;
  left: 0; right: 0; bottom: 4px;
  height: 12px;
  background: var(--accent-yellow);
  opacity: 0.4;
  z-index: -1;
}
.hero-subtitle {
  font-size: 1.1em;
  color: var(--text-mid);
  margin-bottom: 28px;
  line-height: 1.8;
}
.search-box {
  background: white;
  border-radius: 50px;
  padding: 6px 6px 6px 24px;
  display: flex;
  align-items: center;
  box-shadow: 0 8px 24px rgba(74, 138, 184, 0.15);
  max-width: 460px;
  position: relative;
}
.search-box input {
  flex: 1; border: none; outline: none;
  padding: 14px 8px;
  font-size: 1em;
  font-family: inherit;
  background: transparent;
}
.search-btn {
  background: var(--sky-blue-dark);
  color: white; border: none;
  width: 48px; height: 48px;
  flex-shrink: 0;  /* 축소 방지 */
  aspect-ratio: 1 / 1;  /* 정사각형 강제 */
  border-radius: 50%;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
}
.search-results {
  position: absolute;
  top: calc(100% + 6px);
  left: 0; right: 0;
  background: white;
  border-radius: 16px;
  box-shadow: 0 12px 32px rgba(74, 138, 184, 0.25);
  max-height: 320px;
  overflow-y: auto;
  display: none;
  z-index: 999;
}
.search-results.active { display: block; }
.search-result-item {
  padding: 12px 20px;
  cursor: pointer;
  border-bottom: 1px solid #F3F4F6;
  display: flex;
  align-items: center;
  gap: 10px;
}
.search-result-item:hover { background: #FFF8E7; }
.search-result-item:last-child { border-bottom: none; }
.search-result-item .dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.search-result-item .dot.coed { background: #1D9E75; }
.search-result-item .dot.female { background: #D4537E; }
.search-result-item .dot.male { background: #378ADD; }
.search-result-item .name { flex: 1; font-weight: 700; color: var(--text-dark); }
.search-result-item .meta { color: #6B7280; font-size: 0.85em; }

.hero-visual {
  position: relative;
  min-height: 320px;
  display: flex;
  align-items: center;
  justify-content: center;
}
.hero-visual svg { width: 100%; max-width: 420px; height: auto; }
.cloud { position: absolute; opacity: 0.85; }
.cloud-1 { top: 8%; left: 5%; width: 100px; animation: float 8s ease-in-out infinite; }
.cloud-2 { top: 20%; right: 8%; width: 80px; animation: float 10s ease-in-out infinite reverse; }
.cloud-3 { top: 60%; left: 3%; width: 70px; animation: float 7s ease-in-out infinite; animation-delay: 1s; }
@keyframes float {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-15px); }
}

.main-content {
  max-width: 1200px;
  margin: 0 auto;
  padding: 10px 20px 60px;
  position: relative;
}

.map-card {
  background: transparent;
  padding: 20px 0;
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
}

.back-btn {
  display: none;
  margin: 0 auto 16px;
  z-index: 10;
  background: var(--sky-blue-dark);
  color: white;
  border: none;
  padding: 12px 26px;
  border-radius: 30px;
  font-size: 1em;
  font-weight: 700;
  cursor: pointer;
  font-family: inherit;
  box-shadow: 0 6px 20px rgba(74, 138, 184, 0.4);
  transition: background 0.2s, box-shadow 0.2s, transform 0.15s;
  align-items: center;
  gap: 8px;
}
.back-btn:hover {
  background: var(--text-dark);
  box-shadow: 0 8px 24px rgba(74, 138, 184, 0.5);
  transform: translateY(-1px);
}
.back-btn.visible { display: inline-flex; }

.svg-wrap {
  position: relative;
  width: 100%;
  margin: 0 auto;
  perspective: 1500px;
  transition: max-width 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
}

/* 첫화면(전체 보기): PC에서 작게 */
.svg-wrap.overview {
  max-width: 540px;
}

/* 줌인 상태: PC에서 크게 (구별 확대 시) */
.svg-wrap.zoomed {
  max-width: 900px;
}

#daejeonMap {
  width: 100%;
  height: auto;
  display: block;
  filter: drop-shadow(0 8px 24px rgba(180, 140, 80, 0.18));
  transform-style: preserve-3d;
}

.district-group {
  cursor: pointer;
  transition: all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
  transform-origin: center center;
  transform-box: fill-box;
}
.map-state-overview .district-group:hover {
  transform: translateY(-12px) rotateX(8deg) rotateY(-3deg) scale(1.03);
}
.map-state-overview #districts:hover .district-group:not(:hover) {
  opacity: 0.5;
  filter: saturate(0.6);
}
.map-state-zoomed .district-group:not(.zoomed-active) {
  opacity: 0;
  pointer-events: none;
}
.map-state-zoomed .district-group.zoomed-active {
  cursor: default;
  transform: none !important;
}

.district-shape {
  fill: var(--beige-base);
  stroke: #E0D4B5;
  stroke-width: 2;
  stroke-linejoin: round;
  filter: url(#districtShadow);
  transition: all 0.4s ease;
}
.map-state-overview .district-group:hover .district-shape {
  fill: var(--beige-hover);
  stroke: #E8C896;
  stroke-width: 2.5;
  filter: url(#districtShadowHover);
}
.map-state-zoomed .zoomed-active .district-shape {
  fill: var(--beige-hover);
  stroke: #E8C896;
  stroke-width: 2.5;
}

.district-label {
  font-family: 'YeogiOttaeJalnanGothic', sans-serif;
  font-size: 24px;
  fill: var(--text-brown);
  text-anchor: middle;
  dominant-baseline: central;
  pointer-events: none;
  letter-spacing: -0.02em;
  paint-order: stroke;
  stroke: rgba(255, 255, 255, 0.7);
  stroke-width: 4;
  stroke-linejoin: round;
  transition: opacity 0.4s ease;
}
.map-state-zoomed .district-label { opacity: 0; }

.school-marker {
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.4s ease;
  cursor: pointer;
}

/* === overview 상태: 모든 학교 마커 무조건 클릭 차단 === */
.map-state-overview .school-marker,
.map-state-overview .school-marker.active,
.map-state-overview .school-marker.search-highlight {
  pointer-events: none !important;
}

/* 줌인 상태에서만 학교 클릭 가능 */
.map-state-zoomed .school-marker.active {
  opacity: 1;
  pointer-events: auto;
}
.map-state-zoomed .school-marker.search-highlight {
  opacity: 1;
  pointer-events: auto;
}

/* 검색에서 강조하는 시각적 효과만 (overview에선 보이지만 클릭은 막힘) */
.school-marker.search-highlight {
  opacity: 1;
}

.school-pin { pointer-events: none; }

/* 클릭 히트 영역 - 보이지 않지만 클릭 가능 */
.school-hitarea {
  fill: transparent;
  cursor: pointer;
}

/* 모바일 줌인 시: 학교명 살짝 크게 */
@media (max-width: 600px) {
  .map-state-zoomed .school-name {
    font-size: 11px;
  }
}

.school-name {
  font-family: 'Pretendard', sans-serif;
  font-weight: 700;
  font-size: 9px;
  fill: var(--text-dark);
  pointer-events: none;
}

.label-leader {
  pointer-events: none;
  stroke: rgba(92, 69, 48, 0.4);
  stroke-width: 0.8;
  fill: none;
}

/* ===== 모달 - 세련된 4개 버튼 디자인 ===== */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.55);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 1000;
  padding: 20px;
  backdrop-filter: blur(6px);
}
.modal-overlay.active { display: flex; }

.modal {
  background: white;
  border-radius: 28px;
  padding: 36px 32px 32px;
  max-width: 520px;
  width: 100%;
  box-shadow: 0 24px 70px rgba(0,0,0,0.35);
  animation: modalIn 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
  position: relative;
  overflow: hidden;
}
.modal::before {
  content: '';
  position: absolute;
  top: -60px;
  right: -60px;
  width: 200px;
  height: 200px;
  background: radial-gradient(circle, rgba(255, 230, 189, 0.5) 0%, transparent 70%);
  border-radius: 50%;
  pointer-events: none;
}

@keyframes modalIn {
  from { opacity: 0; transform: scale(0.85) translateY(30px); }
  to { opacity: 1; transform: scale(1) translateY(0); }
}

.modal-header {
  text-align: center;
  margin-bottom: 24px;
  position: relative;
  z-index: 1;
}

.modal h3 {
  font-family: 'YeogiOttaeJalnanGothic', sans-serif;
  font-size: 1.7em;
  margin-bottom: 10px;
  color: var(--text-dark);
}

.modal .school-meta {
  display: flex;
  gap: 6px;
  justify-content: center;
  flex-wrap: wrap;
}

.modal .badge {
  display: inline-block;
  padding: 4px 12px;
  border-radius: 12px;
  font-size: 0.82em;
  font-weight: 700;
}
.modal .badge.coed { background: #D1FAE5; color: #065F46; }
.modal .badge.female { background: #FCE7F3; color: #9F1239; }
.modal .badge.male { background: #DBEAFE; color: #1E3A8A; }
.modal .badge.estab { background: #FEF3C7; color: #78350F; }

/* 4개 버튼 - 2x2 그리드 */
.year-section {
  margin-bottom: 14px;
  position: relative;
  z-index: 1;
}

/* 학과별 섹션 (대전외국어고 등) */
.department-section {
  margin-bottom: 14px;
  padding: 12px 14px;
  background: linear-gradient(135deg, #FFF8E7 0%, #FFEFC3 100%);
  border-radius: 12px;
  border: 1px solid #F0DCAA;
}
.department-section:last-child {
  margin-bottom: 4px;
}
.department-label {
  font-family: 'YeogiOttaeJalnanGothic', sans-serif;
  font-size: 0.95em;
  color: #92400E;
  margin-bottom: 8px;
  padding-left: 2px;
}

.year-title {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 10px;
  padding: 0 4px;
}
.year-title .year-badge {
  font-family: 'YeogiOttaeJalnanGothic', sans-serif;
  font-size: 1.05em;
  color: var(--sky-blue-dark);
  font-weight: 700;
  display: inline-flex;
  align-items: center;
  gap: 8px;
}
.year-title .year-badge svg {
  width: 22px;
  height: 22px;
  flex-shrink: 0;
  stroke: var(--sky-blue-dark);
  stroke-width: 1.8;
  fill: none;
  stroke-linecap: round;
  stroke-linejoin: round;
}
.year-title .year-line {
  flex: 1;
  height: 2px;
  background: linear-gradient(90deg, var(--sky-blue-dark) 0%, transparent 100%);
  border-radius: 1px;
}

.year-buttons {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}

.year-btn {
  padding: 18px 16px;
  border: 2px solid transparent;
  border-radius: 16px;
  background: linear-gradient(135deg, #F8FAFB 0%, #F0F4F8 100%);
  font-family: inherit;
  font-size: 0.9em;
  font-weight: 700;
  color: var(--text-dark);
  cursor: pointer;
  transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  position: relative;
  overflow: hidden;
}

.year-btn::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 3px;
  background: var(--sky-blue);
  opacity: 0;
  transition: opacity 0.25s;
}

.year-btn .icon {
  width: 32px;
  height: 32px;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}
.year-btn .icon svg {
  width: 100%;
  height: 100%;
  stroke-width: 1.8;
  fill: none;
  stroke-linecap: round;
  stroke-linejoin: round;
  transition: transform 0.25s;
}
.year-btn:hover .icon svg {
  transform: scale(1.1);
}

.year-btn .label {
  font-size: 0.88em;
  line-height: 1.3;
  text-align: center;
}

.year-btn.curriculum {
  background: linear-gradient(135deg, #E0F2FE 0%, #DBEAFE 100%);
}
.year-btn.curriculum::before { background: var(--sky-blue-dark); }
.year-btn.curriculum .icon svg {
  stroke: var(--sky-blue-dark);
}
.year-btn.curriculum:hover {
  border-color: var(--sky-blue-dark);
  transform: translateY(-3px);
  box-shadow: 0 8px 20px rgba(74, 138, 184, 0.25);
}
.year-btn.curriculum:hover::before { opacity: 1; }

.year-btn.subject {
  background: linear-gradient(135deg, #FFF7E0 0%, #FFE9B3 100%);
}
.year-btn.subject::before { background: #F59E0B; }
.year-btn.subject .icon svg {
  stroke: #B45309;
}
.year-btn.subject:hover {
  border-color: #F59E0B;
  transform: translateY(-3px);
  box-shadow: 0 8px 20px rgba(245, 158, 11, 0.25);
}
.year-btn.subject:hover::before { opacity: 1; }

/* 비활성 버튼 아이콘 색상 */
.year-btn.disabled .icon svg {
  stroke: #9CA3AF;
  opacity: 0.5;
}

.modal .close-btn {
  width: 100%;
  padding: 12px;
  background: transparent;
  color: var(--text-mid);
  border: 2px solid #E5E7EB;
  border-radius: 10px;
  font-family: inherit;
  font-weight: 700;
  cursor: pointer;
  margin-top: 8px;
  transition: all 0.2s;
}
.modal .close-btn:hover {
  background: #F3F4F6;
  border-color: #D1D5DB;
}

/* 비활성 버튼 (준비 중) */
.year-btn.disabled {
  background: linear-gradient(135deg, #F3F4F6 0%, #E5E7EB 100%);
  color: #9CA3AF;
  cursor: pointer;
  position: relative;
}
.year-btn.disabled::before {
  display: none;
}
.year-btn.disabled:hover {
  border-color: #D1D5DB;
  transform: none;
  box-shadow: none;
}
.year-btn.disabled .icon {
  opacity: 0.5;
}
.year-btn .status {
  position: absolute;
  top: 6px;
  right: 6px;
  background: #6B7280;
  color: white;
  font-size: 0.65em;
  padding: 2px 6px;
  border-radius: 8px;
  font-weight: 700;
}

/* 새 탭 열림 배지 */
.year-btn .badge-new {
  position: absolute;
  top: 6px;
  right: 6px;
  background: #F59E0B;
  color: white;
  font-size: 0.62em;
  padding: 2px 6px;
  border-radius: 8px;
  font-weight: 700;
  letter-spacing: -0.02em;
}

/* ============================================ */
/* 편성표 임베드 모달 */
/* ============================================ */
.embed-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.7);
  display: none;
  z-index: 2000;
  padding: 20px;
  backdrop-filter: blur(8px);
  animation: fadeIn 0.25s ease-out;
}
.embed-overlay.active {
  display: flex;
  flex-direction: column;
}
@keyframes fadeIn {
  from { opacity: 0; }
  to { opacity: 1; }
}

.embed-container {
  background: white;
  border-radius: 16px;
  width: 100%;
  height: 100%;
  max-width: 1400px;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  box-shadow: 0 25px 80px rgba(0, 0, 0, 0.4);
  animation: embedIn 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
}
@keyframes embedIn {
  from { opacity: 0; transform: scale(0.95); }
  to { opacity: 1; transform: scale(1); }
}

.embed-header {
  background: linear-gradient(135deg, var(--sky-blue-dark), #6BA6CE);
  color: white;
  padding: 14px 20px;
  display: flex;
  align-items: center;
  gap: 12px;
  flex-shrink: 0;
}

.embed-title {
  font-family: 'YeogiOttaeJalnanGothic', sans-serif;
  font-size: 1.05em;
  flex: 1;
  letter-spacing: -0.02em;
}

.embed-action {
  display: flex;
  align-items: center;
  gap: 6px;
  background: rgba(255, 255, 255, 0.2);
  color: white;
  padding: 7px 14px;
  border-radius: 20px;
  font-size: 0.85em;
  font-weight: 700;
  text-decoration: none;
  transition: background 0.2s;
  font-family: inherit;
  border: none;
  cursor: pointer;
}
.embed-action:hover {
  background: rgba(255, 255, 255, 0.3);
}

.embed-close {
  background: rgba(255, 255, 255, 0.2);
  color: white;
  border: none;
  width: 36px;
  height: 36px;
  border-radius: 50%;
  cursor: pointer;
  font-size: 1.2em;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: background 0.2s;
  font-family: inherit;
}
.embed-close:hover {
  background: rgba(255, 255, 255, 0.35);
}

.embed-frame-wrap {
  flex: 1;
  min-height: 0;
  background: #F9FAFB;
  position: relative;
  overflow: hidden;
}

.embed-frame-wrap iframe {
  width: 100%;
  height: 100%;
  border: none;
  display: block;
}

/* ============================================ */
/* 편성표 디자인 (사이트 디자인 톤) */
/* ============================================ */
.curriculum-table-wrap {
  width: 100%;
  height: 100%;
  overflow: auto;
  padding: 24px;
  background: #FAFBFC;
  -webkit-overflow-scrolling: touch;
}

.curriculum-info {
  display: flex;
  gap: 12px;
  margin-bottom: 20px;
  flex-wrap: wrap;
  padding: 16px 20px;
  background: linear-gradient(135deg, #FFF8E7 0%, #FFE9B3 100%);
  border-radius: 14px;
  border-left: 4px solid var(--accent-yellow);
}

.curriculum-info-item {
  display: flex;
  align-items: center;
  gap: 8px;
}

.curriculum-info-item .label {
  font-size: 0.78em;
  color: var(--text-mid);
  font-weight: 700;
}

.curriculum-info-item .value {
  font-size: 0.95em;
  color: var(--text-dark);
  font-weight: 800;
  font-family: 'YeogiOttaeJalnanGothic', sans-serif;
}

.curriculum-info-divider {
  width: 1px;
  background: rgba(92, 69, 48, 0.2);
  align-self: stretch;
}

/* 표 컨테이너 */
.curriculum-table {
  width: 100%;
  background: white;
  border-radius: 14px;
  overflow: hidden;
  box-shadow: 0 4px 16px rgba(74, 138, 184, 0.1);
  border-collapse: separate;
  border-spacing: 0;
  font-size: 0.85em;
  table-layout: auto;
  min-width: 480px;
}

.curriculum-table thead th {
  background: linear-gradient(135deg, #5392BE 0%, #609EC7 100%);
  color: white;
  font-family: 'YeogiOttaeJalnanGothic', sans-serif;
  font-weight: 700;
  padding: 10px 3px;
  text-align: center;
  font-size: 1em;
  letter-spacing: -0.02em;
  border-right: 1px solid rgba(255,255,255,0.25);
  border-bottom: 1px solid rgba(255,255,255,0.25);
  position: sticky;
  top: 0;
  z-index: 5;
}

.curriculum-table thead th:last-child {
  border-right: none;
}

.curriculum-table thead .group-header {
  background: linear-gradient(135deg, #5392BE 0%, #609EC7 100%);
  color: white;
  font-size: 1em;
  padding: 8px 3px;
  border-bottom: 1px solid rgba(255,255,255,0.25);
}

.curriculum-table tbody td {
  padding: 8px 3px;
  text-align: center;
  border-bottom: 1px solid #F0F4F8;
  border-right: 1px solid #F0F4F8;
  vertical-align: middle;
  background: white;
  transition: background 0.15s;
  font-family: 'Pretendard', sans-serif;
  font-weight: 700;
  font-size: 1em;
  color: var(--text-dark);
}

.curriculum-table tbody tr:hover td {
  background: #FFF8E7;
}

.curriculum-table tbody td:last-child {
  border-right: none;
}

/* 구분 열: 짧은 단어 (학교지정/학생선택)는 세로쓰기 */
.curriculum-table tbody td.section {
  background: linear-gradient(180deg, #FFF8E7 0%, #FFE9B3 100%);
  font-family: 'YeogiOttaeJalnanGothic', sans-serif;
  font-weight: 700;
  font-size: 1em;
  color: var(--text-brown);
  vertical-align: middle;
  border-right: 2px solid #E8C896;
  width: 28px;
  padding: 12px 2px;
}

/* 짧은 단어 → 세로쓰기 */
.curriculum-table tbody td.section.vertical {
  writing-mode: vertical-rl;
  text-orientation: upright;
  letter-spacing: 4px;
}

/* 긴 문구 → 가로쓰기 (학기별 교과 이수학점 등) */
.curriculum-table tbody td.section.horizontal {
  writing-mode: horizontal-tb;
  letter-spacing: -0.02em;
  font-size: 0.95em;
  padding: 10px 6px;
}

/* 학기별 합계 행 - 헤더와 동일한 파란색 */
.curriculum-table tbody tr.summary-row td {
  background: linear-gradient(135deg, #5392BE 0%, #609EC7 100%) !important;
  color: white !important;
  font-family: 'YeogiOttaeJalnanGothic', sans-serif;
  font-weight: 700;
}
.curriculum-table tbody tr.summary-row td.section {
  background: linear-gradient(135deg, #5392BE 0%, #609EC7 100%) !important;
  color: white !important;
  border-right: 1px solid rgba(255,255,255,0.3);
}
.curriculum-table tbody tr.summary-row:hover td {
  background: linear-gradient(135deg, #4982AE 0%, #5494BD 100%) !important;
}

.curriculum-table tbody td.subject-area {
  background: #F0F9FF;
  font-weight: 700;
  font-size: 1em;
  color: var(--text-dark);
  text-align: center;
  width: 41px;
}

.curriculum-table tbody td.subject-name {
  text-align: left;
  padding-left: 6px;
  font-weight: 700;
  font-size: 1em;
  color: var(--text-dark);
  width: 68px;
  min-width: 68px;
}

.curriculum-table tbody td.credits {
  font-weight: 700;
  font-size: 1em;
  color: var(--text-dark);
  width: 30px;
}

.curriculum-table tbody td.semester {
  width: 28px;
  font-weight: 700;
  font-size: 1em;
  color: var(--sky-blue-dark);
  position: relative;
}

.curriculum-table tbody td.semester.has-value {
  background: linear-gradient(135deg, #DBEAFE 0%, #BFDBFE 100%);
  font-size: 1em;
  font-weight: 700;
}

.curriculum-table tbody td.semester.cross-semester {
  background: linear-gradient(135deg, #FEF3C7 0%, #FDE68A 100%);
  color: #78350F;
  font-size: 0.9em;
  font-weight: 700;
}

.curriculum-table tbody td.semester.cross-semester .cross-mark {
  display: block;
  font-size: 0.75em;
  font-weight: 600;
  margin-top: 1px;
  color: #78350F;
  opacity: 0.85;
}

/* 병합된 학기 셀에 여러 값이 있는 경우 (예: "3 3 3") */
.curriculum-table tbody td.semester.multi-value {
  font-size: 1em;
  line-height: 1.5;
  padding: 8px 4px;
  font-weight: 700;
}
.curriculum-table tbody td.semester.multi-value div {
  font-weight: 700;
}

.curriculum-table tbody td.completion-type {
  font-size: 1em;
  color: var(--text-dark);
  font-weight: 700;
  padding: 8px 3px;
  white-space: pre-line;
  line-height: 1.4;
}

.curriculum-table tbody td.total-credits {
  background: linear-gradient(135deg, #DCFCE7 0%, #BBF7D0 100%);
  color: #15803D;
  font-weight: 700;
  font-size: 1em;
  width: 30px;
}

/* 과목유형 - 일반 텍스트, 과목명과 동일 */
.curriculum-table tbody td.subject-type {
  font-family: 'Pretendard', sans-serif;
  font-weight: 700;
  font-size: 1em;
  color: var(--text-dark);
  width: 46px;
}

/* 에러/안내 메시지 */
.curriculum-message {
  padding: 60px 30px;
  text-align: center;
  color: var(--text-mid);
}
.curriculum-message .icon {
  font-size: 3em;
  margin-bottom: 12px;
}
.curriculum-message .title {
  font-family: 'YeogiOttaeJalnanGothic', sans-serif;
  font-size: 1.3em;
  color: var(--text-dark);
  margin-bottom: 8px;
}
.curriculum-message .desc {
  font-size: 0.95em;
  margin-bottom: 16px;
  line-height: 1.7;
}
.curriculum-message .action {
  display: inline-block;
  background: var(--sky-blue-dark);
  color: white;
  padding: 10px 20px;
  border-radius: 8px;
  text-decoration: none;
  font-weight: 700;
  font-size: 0.9em;
}

/* 모바일 반응형 - 편성표 */
@media (max-width: 800px) {
  .curriculum-table-wrap { padding: 14px; }
  .curriculum-info { padding: 12px 14px; gap: 8px; }
  .curriculum-info-item { font-size: 0.85em; }
  .curriculum-table { font-size: 0.78em; min-width: 0; }
  .curriculum-table thead th { padding: 8px 4px; font-size: 0.85em; }
  .curriculum-table tbody td { padding: 7px 4px; }
  .curriculum-table tbody td.section { width: 40px; font-size: 0.85em; padding: 10px 4px; }
}

@media (max-width: 600px) {
  .curriculum-table-wrap { padding: 10px; }
  .curriculum-info { padding: 10px 12px; gap: 6px; flex-direction: column; align-items: flex-start; }
  .curriculum-info-divider { display: none; }
  .curriculum-info-item { font-size: 0.8em; width: 100%; }
  .curriculum-info-item .label { font-size: 0.85em; min-width: 60px; }
  .curriculum-info-item .value { font-size: 0.9em; }
  
  .curriculum-table {
    font-size: 0.65em;
    min-width: 0;
    width: 100%;
    table-layout: fixed;
  }
  .curriculum-table thead th { padding: 6px 2px; font-size: 0.78em; word-break: keep-all; }
  .curriculum-table tbody td { padding: 5px 2px; word-break: keep-all; }
  .curriculum-table tbody td.section { width: 28px; padding: 6px 2px; font-size: 0.75em; letter-spacing: -0.05em; }
  .curriculum-table tbody td.subject { font-size: 0.95em; word-break: keep-all; line-height: 1.3; }
}

@media (max-width: 380px) {
  .curriculum-table { font-size: 0.6em; }
  .curriculum-table thead th { padding: 5px 1px; font-size: 0.75em; }
  .curriculum-table tbody td { padding: 4px 1px; }
}

.embed-loading {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  gap: 12px;
  color: var(--text-mid);
  font-size: 0.95em;
  pointer-events: none;
}
.embed-loading.hidden { display: none; }
.embed-loading .spinner {
  width: 40px;
  height: 40px;
  border: 4px solid #E5E7EB;
  border-top-color: var(--sky-blue-dark);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}
@keyframes spin {
  to { transform: rotate(360deg); }
}

@media (max-width: 600px) {
  .embed-overlay { padding: 0; }
  .embed-container { border-radius: 0; }
  .embed-title { font-size: 0.9em; }
  .embed-action { padding: 6px 10px; font-size: 0.75em; }
  .embed-action .label-text { display: none; }
}

footer {
  background: var(--text-dark);
  color: #B8C5D0;
  text-align: center;
  padding: 30px 20px;
  font-size: 0.9em;
}

@media (max-width: 900px) {
  .hero-inner { grid-template-columns: 1fr; gap: 20px; text-align: center; }
  .hero h1 { font-size: 2em; }
  .search-box { margin: 0 auto; }
  .hero-visual { min-height: 240px; }
}
@media (max-width: 600px) {
  .hero { padding: 30px 18px 16px; }
  .hero h1 { font-size: 1.5em; line-height: 1.3; word-break: keep-all; }
  .hero-subtitle {
    font-size: 0.82em;
    line-height: 1.5;
    margin-bottom: 18px;
    word-break: keep-all;
  }
  
  /* 모바일에서는 hero-visual(일러스트) 숨김 → 바로 지도 보이게 */
  .hero-visual { display: none; }
  .hero-inner {
    grid-template-columns: 1fr;
    gap: 14px;
    text-align: center;
    justify-items: center;  /* grid 자식들 가운데 정렬 */
  }
  
  /* 검색창 작게 + 정중앙 */
  .search-box {
    max-width: 260px;
    width: 100%;
    margin-left: auto;
    margin-right: auto;
    padding: 4px 4px 4px 16px;
  }
  .search-box input {
    padding: 9px 4px;
    font-size: 0.88em;
    min-width: 0;  /* flex 자식 축소 가능 */
  }
  .search-btn {
    width: 38px;
    height: 38px;
  }
  .search-btn svg {
    width: 15px;
    height: 15px;
  }
  
  .main-content { padding: 0 12px 40px; }
  .district-label { font-size: 38px; }
  .school-name { font-size: 12px; }
  .back-btn { padding: 10px 20px; font-size: 0.9em; }
  .modal { padding: 28px 22px 22px; }
  .modal h3 { font-size: 1.4em; }
  .year-btn { padding: 14px 10px; font-size: 0.85em; }
  .year-btn .icon { width: 26px; height: 26px; }
  .year-title .year-badge svg { width: 18px; height: 18px; }
  
  /* 모바일 첫화면: 적당히 (현재 사이즈가 좋음) */
  .svg-wrap.overview { max-width: 360px; }
  /* 모바일 줌인: 화면 거의 가득 차게 (확대 효과) */
  .svg-wrap.zoomed { max-width: 100%; }
}

@media (max-width: 380px) {
  .hero h1 { font-size: 1.35em; }
  .hero-subtitle { font-size: 0.78em; }
  .search-box { max-width: 240px; }
  .svg-wrap.overview { max-width: 320px; }
}
</style>

      hitArea.setAttribute('width', pinW + hitPad * 2);
      hitArea.setAttribute('height', pinH + hitPad * 2);
      hitArea.setAttribute('fill', 'transparent');
      hitArea.setAttribute('pointer-events', 'all');
      g.appendChild(hitArea);
      
      g.addEventListener('click', (e) => {
        e.stopPropagation();
        // overview 상태에선 학교 클릭 차단 (이중 안전장치)
        if (currentState === 'overview') return;
        showSchoolModal(s);
      });
      
      markersGroup.appendChild(g);
    }
  }
}

function animateViewBox(targetVb, duration = 600) {
  const current = svg.getAttribute('viewBox').split(/\s+/).map(Number);
  const target = targetVb.split(/\s+/).map(Number);
  const startTime = performance.now();
  
  function step(now) {
    const elapsed = now - startTime;
    const t = Math.min(elapsed / duration, 1);
    const eased = 1 - Math.pow(1 - t, 3);
    const interpolated = current.map((c, i) => c + (target[i] - c) * eased);
    svg.setAttribute('viewBox', interpolated.join(' '));
    if (t < 1) requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}

function zoomToDistrict(district) {
  const bbox = BBOXES[district];
  if (!bbox) return;
  
  const targetVb = `${bbox.vb_x} ${bbox.vb_y} ${bbox.vb_w} ${bbox.vb_h}`;
  animateViewBox(targetVb);
  
  svg.classList.remove('map-state-overview');
  svg.classList.add('map-state-zoomed');
  
  // wrapper도 줌 상태로 (PC에서 크기 변화)
  const wrap = document.getElementById('svgWrap');
  if (wrap) {
    wrap.classList.remove('overview');
    wrap.classList.add('zoomed');
  }
  
  document.querySelectorAll('.district-group').forEach(g => {
    g.classList.toggle('zoomed-active', g.dataset.district === district);
  });
  document.querySelectorAll('.school-marker').forEach(m => {
    m.classList.toggle('active', m.dataset.district === district);
  });
  
  backBtn.classList.add('visible');
  currentState = 'zoomed';
  currentDistrict = district;
  
  document.querySelector('.main-content').scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function zoomOut() {
  animateViewBox(overviewViewBox);
  svg.classList.remove('map-state-zoomed');
  svg.classList.add('map-state-overview');
  
  // wrapper 첫화면 크기로 복원
  const wrap = document.getElementById('svgWrap');
  if (wrap) {
    wrap.classList.remove('zoomed');
    wrap.classList.add('overview');
  }
  
  document.querySelectorAll('.zoomed-active').forEach(g => g.classList.remove('zoomed-active'));
  document.querySelectorAll('.school-marker').forEach(m => {
    m.classList.remove('active');
    m.classList.remove('search-highlight');
    const pin = m.querySelector('.school-pin');
    if (pin) pin.removeAttribute('filter');
  });
  backBtn.classList.remove('visible');
  currentState = 'overview';
  currentDistrict = null;
}

document.querySelectorAll('.district-group').forEach(g => {

// 편성표 모달 열기 - API로 데이터 + 병합 정보 가져와서 표 그리기
async function openCurriculumEmbed(schoolName, sheetUrl) {
  // 스프레드시트 ID 추출
  const match = sheetUrl.match(/\/spreadsheets\/d\/([a-zA-Z0-9_-]+)/);
  if (!match) {
    alert('스프레드시트 URL이 올바르지 않습니다.');
    return;
  }
  const sheetId = match[1];
  
  // 학교 모달 닫기
  closeModal();
  
  // 임베드 모달 표시 + 로딩
  const embedOverlay = document.getElementById('embedOverlay');
  const embedLoading = document.getElementById('embedLoading');
  const tableWrap = document.getElementById('curriculumTableWrap');
  // 학교명에 "_학과" 형식이 포함되면 분리 표시
  let displayName = schoolName;
  if (schoolName.includes('_')) {
    const parts = schoolName.split('_');
    displayName = `${parts[0]}등학교 (${parts.slice(1).join(' ')})`;
  } else {
    displayName = `${schoolName}등학교`;
  }
  document.getElementById('embedTitle').textContent = `${displayName} - 2026학년도 교육과정 편성표`;
  embedLoading.classList.remove('hidden');
  tableWrap.innerHTML = '';
  embedOverlay.classList.add('active');
  
  try {
    // Google Sheets API: 셀 값 + 병합 정보까지 가져오기
    // ranges: A1:M500, fields: 필요한 것만 (응답 크기 줄임)
    const sheetName = encodeURIComponent('편성표');
    const range = `${sheetName}!A1:M500`;
    const fields = encodeURIComponent('sheets(properties.title,merges,data.rowData.values(formattedValue,effectiveValue))');
    const apiUrl = `https://sheets.googleapis.com/v4/spreadsheets/${sheetId}?ranges=${range}&fields=${fields}`;
    
    const response = await fetch(`${apiUrl}&key=${GOOGLE_API_KEY}`);
    if (!response.ok) {
      const errData = await response.json().catch(() => ({}));
      throw new Error(errData.error?.message || `${response.status} 오류`);
    }
    
    const data = await response.json();
    const sheet = (data.sheets || [])[0];
    if (!sheet) throw new Error('편성표 시트를 찾을 수 없습니다.');
    
    // 병합 정보
    const merges = sheet.merges || [];
    
    // 셀 값들을 2D 배열로 변환
    const rowData = (sheet.data && sheet.data[0] && sheet.data[0].rowData) || [];
    const grid = rowData.map(r => 
      (r.values || []).map(c => (c && c.formattedValue) || '')
    );
    
    if (grid.length < 4) {
      throw new Error('편성표 데이터가 부족합니다.');
    }
    
    // 표 그리기
    renderCurriculumTable(schoolName, grid, merges, sheetUrl);
    embedLoading.classList.add('hidden');
    
  } catch (err) {
    console.error('편성표 로드 실패:', err);
    embedLoading.classList.add('hidden');
    tableWrap.innerHTML = `
      <div class="curriculum-message">
        <div class="icon">⚠️</div>
        <div class="title">편성표를 불러올 수 없습니다</div>
        <div class="desc">
          ${err.message || '알 수 없는 오류가 발생했습니다.'}<br>
          잠시 후 다시 시도해주세요.
        </div>
      </div>
    `;
  }
}

// 데이터 + 병합 정보로 표 그리기 (시트 구조 100% 재현)
function renderCurriculumTable(schoolName, grid, merges, sheetUrl) {
  const tableWrap = document.getElementById('curriculumTableWrap');
  
  // === 메타 정보 추출 (2행) ===
  // 시트 구조: [학교명] [값] [학교 유형] [값] [학년 학급수] [값] [교원수] [값]
  // 병합 셀 때문에 인덱스가 학교마다 다를 수 있어서 라벨 기반으로 매칭
  const metaRow = grid[1] || [];
  console.log('메타 행 (디버그):', metaRow);  // 콘솔에서 확인 가능
  
  const findMetaValue = (labels) => {
    // labels: 찾을 라벨들의 배열 (예: ['학년 학급수', '학년학급수', '학급수'])
    for (let i = 0; i < metaRow.length; i++) {
      const cell = (metaRow[i] || '').toString().trim();
      // 공백 제거해서 비교
      const normalized = cell.replace(/\s/g, '');
      for (const label of labels) {
        if (normalized === label.replace(/\s/g, '')) {
          // 라벨 다음 셀들 중 첫 번째 비어있지 않은 값을 반환
          for (let j = i + 1; j < metaRow.length; j++) {
            const next = (metaRow[j] || '').toString().trim();
            if (next) return next;
          }
        }
      }
    }
    return null;
  };
  
  const meta = {
    schoolName: findMetaValue(['학교명']) || schoolName + '등학교',
    schoolType: findMetaValue(['학교 유형', '학교유형']) || '-',
    classCount: findMetaValue(['학년 학급수', '학년학급수', '학급수']) || '-',
    teacherCount: findMetaValue(['교원수', '교원 수']) || '-',
  };
  
  console.log('메타 정보 (추출 결과):', meta);  // 콘솔에서 확인 가능
  
  // === 병합 정보를 2D 맵으로 정리 ===
  // mergeMap[row][col] = { rowSpan, colSpan } : 병합 시작 셀에만 정보
  // skipMap[row][col] = true : 병합으로 인해 그려지지 않을 셀
  const mergeMap = {};
  const skipMap = {};
  
  for (const m of merges) {
    const startRow = m.startRowIndex;
    const startCol = m.startColumnIndex;
    const endRow = m.endRowIndex;  // exclusive
    const endCol = m.endColumnIndex;  // exclusive
    
    const rowSpan = endRow - startRow;
    const colSpan = endCol - startCol;
    
    if (!mergeMap[startRow]) mergeMap[startRow] = {};
    mergeMap[startRow][startCol] = { rowSpan, colSpan };
    
    // 병합 영역의 나머지 셀들은 스킵
    for (let r = startRow; r < endRow; r++) {
      for (let c = startCol; c < endCol; c++) {
        if (r === startRow && c === startCol) continue;
        if (!skipMap[r]) skipMap[r] = {};
        skipMap[r][c] = true;
      }
    }
  }
  
  // === 데이터 행: 4행부터 (인덱스 3) ===
  const dataStartRow = 3;
  
  // 빈 행 검사: 모든 셀이 비어있고 병합도 안 된 행
  const isEmptyRow = (rowIdx) => {
    const row = grid[rowIdx] || [];
    // 이 행에 시작되는 병합이 있으면 비어있지 않음
    if (mergeMap[rowIdx]) return false;
    // 위에서 내려오는 병합 중인 셀이 있으면 비어있지 않음
    if (skipMap[rowIdx]) return false;
    // 모든 셀이 빈 문자열인지
    return row.every(c => !(c || '').trim());
  };
  
  // 마지막 데이터 행 찾기 (뒤쪽 빈 행 제외)
  let lastDataRow = grid.length - 1;
  while (lastDataRow >= dataStartRow && isEmptyRow(lastDataRow)) {
    lastDataRow--;
  }
  
  // === HTML 생성 ===
  let html = `
    <div class="curriculum-info">
      <div class="curriculum-info-item">
        <span class="label">학교명</span>
        <span class="value">${meta.schoolName}</span>
      </div>
      <div class="curriculum-info-divider"></div>
      <div class="curriculum-info-item">
        <span class="label">학교 유형</span>
        <span class="value">${meta.schoolType}</span>
      </div>
      <div class="curriculum-info-divider"></div>
      <div class="curriculum-info-item">
        <span class="label">학년 학급수</span>
        <span class="value">${meta.classCount}</span>
      </div>
      <div class="curriculum-info-divider"></div>
      <div class="curriculum-info-item">
        <span class="label">교원수</span>
        <span class="value">${meta.teacherCount}</span>
      </div>
    </div>
    
    <table class="curriculum-table">
      <thead>
        <tr>
          <th rowspan="2" style="width:28px;">구분</th>
          <th rowspan="2" style="width:41px;">교과(군)</th>
          <th rowspan="2" style="width:68px; min-width:68px;">과목</th>
          <th rowspan="2" style="width:46px;">과목유형</th>
          <th rowspan="2" style="width:30px;">기본<br>학점</th>
          <th rowspan="2" style="width:45px;">이수<br>구분</th>
          <th colspan="2" class="group-header">1학년</th>
          <th colspan="2" class="group-header">2학년</th>
          <th colspan="2" class="group-header">3학년</th>
          <th rowspan="2" style="width:30px;">운영<br>학점</th>
        </tr>
        <tr>
          <th style="width:28px;">1학기</th>
          <th style="width:28px;">2학기</th>
          <th style="width:28px;">1학기</th>
          <th style="width:28px;">2학기</th>
          <th style="width:28px;">1학기</th>
          <th style="width:28px;">2학기</th>
        </tr>
      </thead>
      <tbody>
  `;
  
  // 본문: 데이터 행마다 셀 그리기
  const NUM_COLS = 13;
  
  // "편성 조건 준수 여부 점검" 행을 만나면 거기서 끝
  // (그 이후는 점검표라 표시 안 함)
  let stopRow = lastDataRow + 1;
  for (let r = dataStartRow; r <= lastDataRow; r++) {
    const row = grid[r] || [];
    const allText = row.map(c => (c || '').toString()).join(' ');
    if (allText.includes('편성 조건') && allText.includes('점검')) {
      stopRow = r;
      break;
    }
    // 또는 "편성조건준수" 같은 변형도 처리
    if (allText.replace(/\s/g, '').includes('편성조건') && allText.includes('점검')) {
      stopRow = r;
      break;
    }
  }
  
  // 합계 행 미리 식별 (병합 셀 처리)
  // A열의 병합된 셀 영역에 "학기별" 등 키워드가 있으면 그 영역 전체가 합계 행
  const summaryRowSet = new Set();
  for (let r = dataStartRow; r < stopRow; r++) {
    const row = grid[r] || [];
    const sectionText = (row[0] || '').toString();
    if (/학기별|이수학점|이수\s*과목수|창의적|체험활동|소계|합계|총계/.test(sectionText)) {
      // 이 셀에서 시작하는 병합 영역 전체를 합계 행으로 표시
      const merge = mergeMap[r] && mergeMap[r][0];
      const endRow = merge ? r + merge.rowSpan : r + 1;
      for (let rr = r; rr < endRow; rr++) {
        summaryRowSet.add(rr);
      }
    }
  }
  
  for (let r = dataStartRow; r < stopRow; r++) {
    const row = grid[r] || [];
    
    // 행 전체가 비었으면(병합도 없음) 스킵
    if (isEmptyRow(r)) continue;
    
    const trClass = summaryRowSet.has(r) ? ' class="summary-row"' : '';
    html += `<tr${trClass}>`;
    
    for (let c = 0; c < NUM_COLS; c++) {
      // 병합으로 가려진 셀은 그리지 않음
      if (skipMap[r] && skipMap[r][c]) continue;
      
      const value = (row[c] || '').toString().trim();
      const merge = mergeMap[r] && mergeMap[r][c];
      const rowSpan = merge ? merge.rowSpan : 1;
      const colSpan = merge ? merge.colSpan : 1;
      const spanAttr = `${rowSpan > 1 ? ` rowspan="${rowSpan}"` : ''}${colSpan > 1 ? ` colspan="${colSpan}"` : ''}`;
      
      html += renderCurriculumCell(c, value, spanAttr);
    }
    
    html += '</tr>';
  }
  
  html += `
      </tbody>
    </table>
  `;
  
  tableWrap.innerHTML = html;
}

// 컬럼별 셀 렌더링 (열 인덱스에 따라 스타일 달리)
function renderCurriculumCell(colIdx, value, spanAttr) {
  // 0: 구분, 1: 교과(군), 2: 과목, 3: 과목유형, 4: 기본학점, 5: 이수구분
  // 6~11: 학기별 (1-1, 1-2, 2-1, 2-2, 3-1, 3-2)
  // 12: 운영학점
  
  if (colIdx === 0) {
    // 구분 (학교지정/학생선택은 세로, 긴 문구는 가로)
    // 4글자 이하면 세로쓰기, 그 이상은 가로쓰기
    const cleanValue = value.replace(/\s/g, '');
    const orientClass = cleanValue.length <= 4 ? 'vertical' : 'horizontal';
    return `<td class="section ${orientClass}"${spanAttr}>${value}</td>`;
  }
  if (colIdx === 1) {
    // 교과(군)
    return `<td class="subject-area"${spanAttr}>${value}</td>`;
  }
  if (colIdx === 2) {
    // 과목명
    return `<td class="subject-name"${spanAttr}>${value}</td>`;
  }
  if (colIdx === 3) {
    // 과목유형 - 일반 텍스트 (배지 아님, 과목명과 동일한 폰트/크기)
    return `<td class="subject-type"${spanAttr}>${value}</td>`;
  }
  if (colIdx === 4) {
    // 기본학점
    return `<td class="credits"${spanAttr}>${value}</td>`;
  }
  if (colIdx === 5) {
    // 이수구분 - "선택군A 택7" 같은 경우 공백을 줄바꿈으로
    // 이미 \n이 있으면 그대로, 없고 공백이 있으면 첫 공백을 줄바꿈으로
    let display = value;
    if (!display.includes('\n') && /\s/.test(display)) {
      // "선택군A 택7" → "선택군A\n택7"
      display = display.replace(/\s+/, '\n');
    }
    // pre-line CSS로 \n이 줄바꿈으로 표시됨
    return `<td class="completion-type"${spanAttr}>${display}</td>`;
  }
  if (colIdx >= 6 && colIdx <= 11) {
    // 학기별 단위
    return renderSemesterCell(value, spanAttr);
  }
  if (colIdx === 12) {
    // 운영학점
    return `<td class="total-credits"${spanAttr}>${value}</td>`;
  }
  // 기본
  return `<td${spanAttr}>${value}</td>`;
}

// 학기별 셀 렌더링 (학기교차 처리, 병합 대응)
function renderSemesterCell(value, spanAttr = '') {
  if (!value) {
    return `<td class="semester"${spanAttr}></td>`;
  }
  
  // "3 (학기교차)" 같은 표기 처리
  if (value.includes('학기교차') || value.includes('교차')) {
    const num = value.match(/^\d+/);
    return `<td class="semester cross-semester has-value"${spanAttr}>
      ${num ? num[0] : value}
      <span class="cross-mark">학기교차</span>
    </td>`;
  }
  
  // 줄바꿈이 있는 다중 값 (병합셀의 "3 3 3 / 3 3 3 / 3" 같은 경우)
  if (value.includes('\n')) {
    const lines = value.split('\n').map(l => l.trim()).filter(l => l);
    return `<td class="semester multi-value has-value"${spanAttr}>
      ${lines.map(l => `<div>${l}</div>`).join('')}
    </td>`;
  }
  
  return `<td class="semester has-value"${spanAttr}>${value}</td>`;
}

function closeEmbedModal() {
  const embedOverlay = document.getElementById('embedOverlay');
  embedOverlay.classList.remove('active');
  // 표 컨테이너 비우기
  setTimeout(() => {
    const tableWrap = document.getElementById('curriculumTableWrap');
    if (tableWrap) tableWrap.innerHTML = '';
  }, 300);
}

// 시뮬레이터 임베드 모달
function openSimulatorEmbed(schoolName, sheetId) {
  closeModal();
  
  const overlay = document.getElementById('simulatorOverlay');
  const titleEl = document.getElementById('simulatorTitle');
  const frame = document.getElementById('simulatorFrame');
  
  titleEl.textContent = `${schoolName}등학교 - 과목 선택 시뮬레이터`;
  // iframe src 설정 - embed=1 파라미터로 헤더 숨김
  frame.src = `simulator.html?school=${encodeURIComponent(schoolName)}&sheetId=${sheetId}&embed=1`;
  
  overlay.classList.add('active');
}

function closeSimulatorModal() {
  const overlay = document.getElementById('simulatorOverlay');
  overlay.classList.remove('active');
  setTimeout(() => {
    const frame = document.getElementById('simulatorFrame');
    if (frame) frame.src = 'about:blank';
  }, 300);
}

function closeModal() {
  document.getElementById('modalOverlay').classList.remove('active');
}

document.getElementById('modalOverlay').addEventListener('click', (e) => {
  if (e.target.id === 'modalOverlay') closeModal();
});

// 시뮬레이터 iframe에서 보내는 메시지 받기
window.addEventListener('message', (e) => {
  if (e.data && e.data.action === 'closeSimulator') {
    closeSimulatorModal();
  }
});

// 임베드 모달: 배경 클릭 시 닫기
document.getElementById('embedOverlay').addEventListener('click', (e) => {
  if (e.target.id === 'embedOverlay') closeEmbedModal();
});

// 시뮬레이터 모달: 배경 클릭 시 닫기
document.getElementById('simulatorOverlay').addEventListener('click', (e) => {
  if (e.target.id === 'simulatorOverlay') closeSimulatorModal();
});

// ESC 키로 모달 닫기
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    if (document.getElementById('simulatorOverlay').classList.contains('active')) {
      closeSimulatorModal();
    } else if (document.getElementById('embedOverlay').classList.contains('active')) {
      closeEmbedModal();
    } else if (document.getElementById('modalOverlay').classList.contains('active')) {
      closeModal();
    }
  }
});

const searchInput = document.getElementById('schoolSearch');
const searchResults = document.getElementById('searchResults');

const allSchoolsList = [];
for (const [district, schools] of Object.entries(SCHOOLS)) {
  for (const s of schools) {
    allSchoolsList.push({ ...s, district, districtKr: DISTRICT_KR[district] });
  }
}

searchInput.addEventListener('input', function() {
  const q = this.value.trim().toLowerCase();
  if (!q) { searchResults.classList.remove('active'); return; }
  
  const matches = allSchoolsList.filter(s => 
    s.name.toLowerCase().includes(q) || s.districtKr.includes(q)
  ).slice(0, 8);
  
  if (matches.length === 0) {
    searchResults.innerHTML = '<div class="search-result-item" style="cursor:default; color:#9CA3AF;">검색 결과가 없습니다</div>';
    searchResults.classList.add('active');
    return;
  }
  
  searchResults.innerHTML = matches.map(s => `
    <div class="search-result-item" data-name="${s.name}" data-district="${s.district}">
      <span class="dot ${s.type}"></span>
      <span class="name">${s.name}</span>
      <span class="meta">${s.districtKr} · ${TYPE_KR[s.type]}</span>
    </div>
  `).join('');
  searchResults.classList.add('active');
  
  searchResults.querySelectorAll('.search-result-item').forEach(el => {
    el.addEventListener('click', function() {
      const name = this.dataset.name;
      const district = this.dataset.district;
      
      searchResults.classList.remove('active');
      searchInput.value = '';
      
      // 학교 정보 찾기
      const schoolInfo = SCHOOLS[district].find(s => s.name === name);
      if (!schoolInfo) return;
      
      // 줌인 (이미 줌인된 같은 구라면 스킵)
      if (currentState !== 'zoomed' || currentDistrict !== district) {
        zoomToDistrict(district);
      }
      
      // 핀 강조 + 모달 표시 (줌인 애니메이션 끝난 후)
      setTimeout(() => {
        document.querySelectorAll('.school-marker').forEach(m => {
          m.classList.remove('search-highlight');
          const pin = m.querySelector('.school-pin');
          if (pin) pin.removeAttribute('filter');
        });
        const target = document.querySelector(`.school-marker[data-name="${name}"]`);
        if (target) {
          target.classList.add('search-highlight');
          const pin = target.querySelector('.school-pin');
          if (pin) pin.setAttribute('filter', 'url(#searchGlow)');
          markersGroup.appendChild(target);
        }
        // 모달 자동 표시
        showSchoolModal(schoolInfo);
        // 핀 강조는 5초 후 해제
        setTimeout(() => {
          if (target) {
            target.classList.remove('search-highlight');
            const pin = target.querySelector('.school-pin');
            if (pin) pin.removeAttribute('filter');
          }
        }, 5000);
      }, 700);
    });
  });
});

document.addEventListener('click', (e) => {
  if (!e.target.closest('.search-box')) {
    searchResults.classList.remove('active');
  }
});

document.fonts.ready.then(() => {
  document.querySelectorAll('.district-label').forEach(t => {
    t.style.fontFamily = "'YeogiOttaeJalnanGothic', sans-serif";
  });
});

renderAllMarkers();
</script>
