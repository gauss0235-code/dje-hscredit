<style>
:root {
  --sky-blue-dark: #4A8AB8;
  --sky-blue: #87BAD7;
  --beige: #FFF8E7;
  --beige-deep: #FFE9B3;
  --text-dark: #2C3E50;
  --text-mid: #6B7280;
  --text-brown: #6B4423;
  --green-bg: #DCFCE7;
  --green-text: #15803D;
  --orange-bg: #FEF3C7;
  --orange-text: #B45309;
  --red-bg: #FEE2E2;
  --red-text: #B91C1C;
  --gradient-blue: linear-gradient(135deg, #5392BE 0%, #609EC7 100%);
  --gradient-beige: linear-gradient(180deg, #FFF8E7 0%, #FFE9B3 100%);
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: 'Pretendard', sans-serif;
  background: linear-gradient(180deg, #E0F2FE 0%, #FFFFFF 30%);
  color: var(--text-dark);
  min-height: 100vh;
  line-height: 1.6;
}

/* ============ 진행률 바 (상단 고정) ============ */
.top-sticky {
  position: sticky;
  top: 0;
  z-index: 100;
  background: white;
  box-shadow: 0 2px 8px rgba(0,0,0,0.06);
}

.progress-bar {
  background: white;
  padding: 14px 20px;
}

.progress-content {
  max-width: 800px;
  margin: 0 auto;
  display: flex;
  align-items: center;
  gap: 16px;
}

.progress-back {
  background: linear-gradient(135deg, #5392BE 0%, #609EC7 100%);
  border: none;
  border-radius: 10px;
  padding: 9px 16px;
  font-family: 'YeogiOttaeJalnanGothic', sans-serif;
  font-size: 0.9em;
  color: white;
  cursor: pointer;
  white-space: nowrap;
  transition: all 0.18s;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  box-shadow: 0 2px 8px rgba(74, 138, 184, 0.25);
}
.progress-back:hover {
  transform: translateY(-1px);
  box-shadow: 0 4px 12px rgba(74, 138, 184, 0.35);
}
.progress-back:active {
  transform: translateY(0);
}
.progress-back svg {
  width: 14px;
  height: 14px;
  stroke: currentColor;
  stroke-width: 2.5;
  fill: none;
  stroke-linecap: round;
  stroke-linejoin: round;
}

.progress-info {
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.progress-text {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 0.85em;
  color: var(--text-mid);
}

.progress-text strong {
  color: var(--sky-blue-dark);
  font-family: 'YeogiOttaeJalnanGothic', sans-serif;
  font-weight: 700;
  font-size: 1.1em;
}

.progress-track {
  height: 6px;
  background: #F0F4F8;
  border-radius: 3px;
  overflow: hidden;
}

.progress-fill {
  height: 100%;
  background: var(--gradient-blue);
  border-radius: 3px;
  transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
}

/* ============ 메인 컨테이너 ============ */
.main {
  max-width: 800px;
  margin: 0 auto;
  padding: 30px 20px 60px;
}

.school-header {
  text-align: center;
  margin-bottom: 30px;
}

.school-name {
  font-family: 'YeogiOttaeJalnanGothic', sans-serif;
  font-size: 1.5em;
  color: var(--sky-blue-dark);
  margin-bottom: 4px;
}

.school-sub {
  font-size: 0.92em;
  color: var(--text-mid);
}

/* ============ 단계 카드 ============ */
.step-card {
  background: white;
  border-radius: 20px;
  padding: 32px;
  box-shadow: 0 4px 20px rgba(74, 138, 184, 0.08);
  border: 1px solid #F0F4F8;
}

.step-title {
  font-family: 'YeogiOttaeJalnanGothic', sans-serif;
  font-size: 1.6em;
  color: var(--text-dark);
  margin-bottom: 8px;
  display: flex;
  align-items: center;
  gap: 10px;
}

.step-icon-wrap {
  width: 36px;
  height: 36px;
  background: var(--gradient-blue);
  border-radius: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}
.step-icon-wrap svg {
  width: 22px;
  height: 22px;
  stroke: white;
  stroke-width: 2;
  fill: none;
  stroke-linecap: round;
  stroke-linejoin: round;
}

.step-desc {
  font-size: 0.95em;
  color: var(--text-mid);
  margin-bottom: 24px;
  line-height: 1.6;
}

/* ============ 진로 선택 (Step 1) ============ */
.career-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 14px;
  margin-bottom: 30px;
}

.career-card {
  padding: 24px 18px;
  border: 2px solid #E5E7EB;
  border-radius: 16px;
  background: white;
  cursor: pointer;
  text-align: center;
  transition: all 0.2s;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 10px;
  font-family: inherit;
  font-size: 1em;
  color: var(--text-dark);
}

.career-card:hover {
  border-color: var(--sky-blue);
  transform: translateY(-2px);
  box-shadow: 0 6px 16px rgba(74, 138, 184, 0.15);
}

.career-card.selected {
  border-color: var(--sky-blue-dark);
  background: linear-gradient(135deg, #E0F2FE 0%, #DBEAFE 100%);
  box-shadow: 0 6px 20px rgba(74, 138, 184, 0.2);
}

.career-card .career-icon {
  width: 48px;
  height: 48px;
  display: flex;
  align-items: center;
  justify-content: center;
}
.career-card .career-icon svg {
  width: 100%;
  height: 100%;
  stroke: var(--sky-blue-dark);
  stroke-width: 1.6;
  fill: none;
  stroke-linecap: round;
  stroke-linejoin: round;
}

.career-card .career-name {
  font-family: 'YeogiOttaeJalnanGothic', sans-serif;
  font-size: 1.1em;
  color: var(--sky-blue-dark);
}

.career-card .career-desc {
  font-size: 0.82em;
  color: var(--text-mid);
  line-height: 1.4;
}

/* ============ 학기 단계 (Step 2~7) ============ */
.semester-summary {
  background: var(--gradient-beige);
  border-radius: 12px;
  padding: 14px 18px;
  margin-bottom: 24px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 0.92em;
  color: var(--text-brown);
  border: 1px solid #E8C896;
  flex-wrap: wrap;
  gap: 8px;
}
.semester-summary .credit-status {
  font-family: 'YeogiOttaeJalnanGothic', sans-serif;
  font-size: 1.1em;
}
.semester-summary .credit-status.complete {
  color: var(--green-text);
}
.semester-summary .credit-status.error {
  color: var(--red-text);
}

/* 검증 경고 박스 */
.validation-alert {
  background: linear-gradient(135deg, #FEE2E2 0%, #FECACA 100%);
  border: 2px solid #FCA5A5;
  border-radius: 14px;
  padding: 14px 18px;
  margin-bottom: 20px;
  display: flex;
  gap: 10px;
  align-items: flex-start;
}
.validation-alert .alert-icon {
  width: 28px;
  height: 28px;
  background: #DC2626;
  border-radius: 50%;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  color: white;
  font-family: 'YeogiOttaeJalnanGothic', sans-serif;
  font-size: 0.95em;
}
.validation-alert .alert-content {
  flex: 1;
  min-width: 0;
}
.validation-alert .alert-title {
  font-family: 'YeogiOttaeJalnanGothic', sans-serif;
  font-size: 0.95em;
  color: #991B1B;
  margin-bottom: 4px;
}
.validation-alert .alert-msg {
  font-size: 0.88em;
  color: #7F1D1D;
  line-height: 1.5;
}
.validation-alert .alert-msg + .alert-msg {
  margin-top: 4px;
}

/* === 한도 초과 토스트 알림 === */
.toast-alert {
  position: fixed;
  bottom: 30px;
  left: 50%;
  transform: translateX(-50%) translateY(100px);
  background: linear-gradient(135deg, #DC2626 0%, #B91C1C 100%);
  color: white;
  padding: 14px 22px;
  border-radius: 14px;
  font-family: 'YeogiOttaeJalnanGothic', sans-serif;
  font-size: 0.95em;
  box-shadow: 0 8px 24px rgba(220, 38, 38, 0.3);
  z-index: 1000;
  opacity: 0;
  transition: opacity 0.25s, transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
  max-width: 90vw;
  text-align: center;
  pointer-events: none;
}
.toast-alert.show {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
}

/* 흔들림 효과 (한도 초과 시 그룹 강조) */
@keyframes shake-x {
  0%, 100% { transform: translateX(0); }
  25% { transform: translateX(-6px); }
  75% { transform: translateX(6px); }
}
.choice-group.shake,
.subject-card.shake {
  animation: shake-x 0.3s ease-in-out 2;
}

/* === 진행률 바 아래 학점 상태 (top-sticky 안에 들어감) === */
.status-summary {
  background: linear-gradient(135deg, #F8FAFB 0%, #F0F4F8 100%);
  border-top: 1px solid #E5E7EB;
  padding: 8px 20px 10px;
  font-size: 0.85em;
}
.status-summary .status-content {
  max-width: 800px;
  margin: 0 auto;
}
.status-summary .status-quick {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}
.status-summary .status-quick .item {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 4px 10px;
  background: white;
  border-radius: 8px;
  border: 1px solid #E5E7EB;
  font-size: 0.92em;
}
.status-summary .status-quick .item .label {
  color: var(--text-mid);
  font-size: 0.92em;
}
.status-summary .status-quick .item .value {
  font-family: 'YeogiOttaeJalnanGothic', sans-serif;
  color: var(--sky-blue-dark);
  font-size: 0.95em;
}
.status-summary .status-quick .item.complete {
  background: #DCFCE7;
  border-color: #86EFAC;
}
.status-summary .status-quick .item.complete .value,
.status-summary .status-quick .item .value.ok {
  color: var(--green-text);
}
.status-summary .status-quick .item.over {
  background: #FEE2E2;
  border-color: #FCA5A5;
}
.status-summary .status-quick .item.over .value,
.status-summary .status-quick .item .value.over {
  color: var(--red-text);
}
.status-summary .status-quick .item.shortage {
  background: white;
}
.status-summary .status-detail {
  display: none;  /* 더 이상 사용 안 함 */
}
.status-summary .status-section {
  margin-bottom: 8px;
}
.status-summary .status-section:last-child {
  margin-bottom: 0;
}
.status-summary .status-section .section-label {
  font-family: 'YeogiOttaeJalnanGothic', sans-serif;
  color: var(--text-dark);
  font-size: 0.92em;
  margin-bottom: 4px;
}
.status-summary .area-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
  gap: 4px 12px;
  font-size: 0.86em;
}
.status-summary .area-item {
  display: flex;
  justify-content: space-between;
  padding: 2px 0;
}
.status-summary .area-item .area-name {
  color: var(--text-mid);
}
.status-summary .area-item .area-value {
  font-weight: 700;
  color: var(--sky-blue-dark);
}
.status-summary .area-item.complete .area-value {
  color: var(--green-text);
}
.status-summary .area-item.shortage .area-value {
  color: var(--orange-text);
}
.status-summary .area-item .check-mark {
  margin-left: 4px;
  font-size: 0.92em;
}
.status-summary .area-item.complete .check-mark { color: var(--green-text); }
.status-summary .area-item.shortage .check-mark { color: var(--orange-text); }

/* 학교지정 영역 */
.section-block {
  margin-bottom: 28px;
}

.section-header {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 14px;
  font-family: 'YeogiOttaeJalnanGothic', sans-serif;
  font-size: 1.05em;
  color: var(--text-dark);
}

.section-badge {
  display: inline-block;
  padding: 3px 10px;
  border-radius: 6px;
  font-size: 0.78em;
  font-family: 'YeogiOttaeJalnanGothic', sans-serif;
}
.section-badge.fixed {
  background: var(--gradient-beige);
  color: var(--text-brown);
  border: 1px solid #E8C896;
}
.section-badge.choice {
  background: linear-gradient(135deg, #FEF3C7 0%, #FDE68A 100%);
  color: #92400E;
  border: 1px solid #F59E0B;
}

.section-info {
  font-size: 0.85em;
  color: var(--text-mid);
  font-family: 'Pretendard', sans-serif;
  font-weight: 400;
}

/* 과목 카드 리스트 */
.subject-list {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.subject-card {
  border: 2px solid #F0F4F8;
  border-radius: 12px;
  background: white;
  overflow: hidden;
  transition: all 0.15s;
}

.subject-card.fixed {
  background: linear-gradient(180deg, #FFFCF5 0%, #FFFAEC 100%);
  border-color: #F0E6D0;
}

.subject-card.selected:not(.fixed) {
  border-color: var(--sky-blue-dark);
  background: linear-gradient(135deg, #F0F9FF 0%, #E0F2FE 100%);
}

.subject-card.recommended {
  position: relative;
}
.subject-card.recommended::before {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  width: 4px;
  height: 100%;
  background: linear-gradient(180deg, #F59E0B 0%, #EA580C 100%);
}

.subject-main {
  padding: 12px 16px;
  display: flex;
  align-items: center;
  gap: 12px;
  cursor: pointer;
  user-select: none;
}

.subject-checkbox {
  width: 22px;
  height: 22px;
  border: 2px solid #D1D5DB;
  border-radius: 6px;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.15s;
  background: white;
}

.subject-card.selected .subject-checkbox {
  background: var(--sky-blue-dark);
  border-color: var(--sky-blue-dark);
}

.subject-checkbox svg {
  width: 14px;
  height: 14px;
  stroke: white;
  stroke-width: 3;
  fill: none;
  stroke-linecap: round;
  stroke-linejoin: round;
  opacity: 0;
  transition: opacity 0.15s;
}
.subject-card.selected .subject-checkbox svg {
  opacity: 1;
}

.subject-card.fixed .subject-checkbox {
  background: var(--text-brown);
  border-color: var(--text-brown);
  cursor: not-allowed;
}
.subject-card.fixed .subject-checkbox svg {
  opacity: 1;
}

.subject-info {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.subject-row1 {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}

.subject-name {
  font-weight: 700;
  font-size: 1em;
  color: var(--text-dark);
}

.subject-recommend-mark {
  display: inline-block;
  font-size: 0.75em;
  padding: 2px 6px;
  border-radius: 4px;
  background: linear-gradient(135deg, #FEF3C7 0%, #FDE68A 100%);
  color: #92400E;
  font-family: 'YeogiOttaeJalnanGothic', sans-serif;
}

.subject-suneung-mark {
  display: inline-block;
  font-size: 0.75em;
  padding: 2px 6px;
  border-radius: 4px;
  background: linear-gradient(135deg, #FEE2E2 0%, #FECACA 100%);
  color: #991B1B;
  font-family: 'YeogiOttaeJalnanGothic', sans-serif;
}

/* 다른 학기에 같은 과목이 있을 때 (중복 차단 안내) */
.subject-duplicate-mark {
  display: inline-block;
  font-size: 0.75em;
  padding: 2px 6px;
  border-radius: 4px;
  background: linear-gradient(135deg, #FFEDD5 0%, #FED7AA 100%);
  color: #9A3412;
  font-family: 'YeogiOttaeJalnanGothic', sans-serif;
}
.subject-card.duplicate {
  background: #F9FAFB;
  border-color: #E5E7EB;
  opacity: 0.85;
}
.subject-card.duplicate .subject-name {
  color: var(--text-mid);
}
.subject-card.duplicate:hover {
  background: #F3F4F6;
  border-color: #FBBF77;
}

.subject-row2 {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 0.82em;
  color: var(--text-mid);
}

.subject-tag {
  display: inline-block;
  padding: 1px 6px;

async function init() {
  if (!SCHOOL_NAME || !SHEET_ID) {
    showError('학교 정보가 없어요', 'URL이 잘못되었습니다. 메인 페이지에서 다시 시도해주세요.');
    return;
  }
  
  // 학교명에 "_학과" 형식이 포함되면 분리 표시 (예: "대전외국어고_영어과")
  let displaySchoolName = SCHOOL_NAME;
  let displayDept = '';
  if (SCHOOL_NAME.includes('_')) {
    const parts = SCHOOL_NAME.split('_');
    displaySchoolName = parts[0];
    displayDept = parts.slice(1).join(' ');
  }
  
  document.getElementById('schoolNameDisplay').textContent = displayDept 
    ? `${displaySchoolName}등학교 (${displayDept})`
    : `${displaySchoolName}등학교`;
  document.title = displayDept
    ? `${displaySchoolName}고 ${displayDept} - 과목 선택 시뮬레이터`
    : `${displaySchoolName}고 - 과목 선택 시뮬레이터`;
  
  // embed 모드: 홈 버튼 라벨을 "닫기"로 변경
  if (IS_EMBED) {
    document.getElementById('homeBackLabel').textContent = '닫기';
    // 스크롤 시작 위치
    document.body.style.background = 'transparent';
  }
  
  // === 상태 복원: URL 파라미터(공유 링크) 우선, 없으면 localStorage ===
  // 'c': LZ-string 압축 (새 방식, 짧음)
  // 's': Base64 (구 방식, 길음 - 호환성 유지)
  const compressedParam = urlParams.get('c');
  const sharedStateParam = urlParams.get('s');
  let restoredFromShare = false;
  
  if (compressedParam || sharedStateParam) {
    try {
      let json = null;
      if (compressedParam && typeof LZString !== 'undefined') {
        // 새 방식: LZ-string 압축 해제
        json = LZString.decompressFromEncodedURIComponent(compressedParam);
      } else if (sharedStateParam) {
        // 구 방식: Base64 (UTF-8 안전)
        json = decodeURIComponent(escape(atob(sharedStateParam)));
      }
      
      if (json) {
        const sharedState = JSON.parse(json);
        if (sharedState && sharedState.career && sharedState.selections) {
          state.career = sharedState.career;
          state.selections = sharedState.selections;
          // 보기 전용 모드면 무조건 결과 단계로
          state.currentStep = IS_VIEW_ONLY ? 8 : (sharedState.step || 8);
          state.fromShare = true;
          restoredFromShare = true;
        }
      }
    } catch (e) {
      console.warn('공유 링크 상태 복원 실패:', e);
    }
  }
  
  if (!restoredFromShare && !IS_VIEW_ONLY && !IS_FRESH_START) {
    // 이전 진행 상태 복원 (localStorage)
    // - view 모드면 절대 안 함 (보기 전용)
    // - fresh 모드면 절대 안 함 ("나도 해보기"로 처음부터 시작)
    loadState();
  }
  
  // fresh 모드: 기존 localStorage도 삭제하여 다음 방문에도 영향 없도록
  if (IS_FRESH_START) {
    try {
      localStorage.removeItem(`simulator-${SCHOOL_NAME}`);
    } catch (e) {}
  }
  
  try {
    // 1. PDF 과목 설명 데이터 로드 (선택적)
    try {
      const lookupRes = await fetch('subject_lookup.json');
      if (lookupRes.ok) {
        state.subjectLookup = await lookupRes.json();
      }
    } catch (e) {
      console.log('과목 설명 데이터 없음 (선택적)');
      state.subjectLookup = {};
    }
    
    // 2. 편성표 데이터 로드
    state.curriculumData = await loadCurriculum();
    
    // 3. 첫 단계 (진로 선택) 표시
    renderStep();
  } catch (err) {
    showError('편성표를 불러올 수 없어요', err.message || '오류가 발생했습니다.');
  }
}

// ============================================
// 편성표 로드 + 분석
// ============================================
async function loadCurriculum() {
  const sheetName = encodeURIComponent('편성표');
  const range = `${sheetName}!A1:M500`;
  const fields = encodeURIComponent('sheets(merges,data.rowData.values(formattedValue))');
  const url = `https://sheets.googleapis.com/v4/spreadsheets/${SHEET_ID}?ranges=${range}&fields=${fields}&key=${GOOGLE_API_KEY}`;
  
  const res = await fetch(url);
  if (!res.ok) {
    const err = await res.json().catch(() => ({}));
    throw new Error(err.error?.message || `${res.status} 오류`);
  }
  
  const data = await res.json();
  const sheet = data.sheets[0];
  const merges = sheet.merges || [];
  const rowData = sheet.data[0]?.rowData || [];
  
  // 그리드
  const grid = rowData.map(r => 
    (r.values || []).map(c => (c && c.formattedValue) || '')
  );
  
  // 병합 맵 (병합 시작 셀의 값을 영역 전체에 복사)
  const expandedGrid = grid.map(r => [...r]);
  for (const m of merges) {
    const startVal = (grid[m.startRowIndex] || [])[m.startColumnIndex] || '';
    for (let r = m.startRowIndex; r < m.endRowIndex; r++) {
      for (let c = m.startColumnIndex; c < m.endColumnIndex; c++) {
        if (!expandedGrid[r]) expandedGrid[r] = [];
        expandedGrid[r][c] = startVal;
      }
    }
  }
  
  // === 학교 유형 추출 (2행) ===
  // 라벨-값 매칭 방식 (편성표 모달과 동일)
  const metaRow = expandedGrid[1] || [];
  let schoolTypeText = '-';
  for (let i = 0; i < metaRow.length; i++) {
    const cell = (metaRow[i] || '').toString().trim();
    if (cell.replace(/\s/g, '').includes('학교유형')) {
      for (let j = i + 1; j < metaRow.length; j++) {
        const next = (metaRow[j] || '').toString().trim();
        if (next && next !== cell) { schoolTypeText = next; break; }
      }
      break;
    }
  }
  console.log('학교 유형:', schoolTypeText);
  
  // === 학교 유형 분류 ===
  // 일반고: 공립/사립 일반고 → 표준 규정
  // 자율/특수목적고: 자공고/자사고/특목고 → 완화 규정 (예술 5, 기술/제2외국어 등 12)
  // 점검 대상 외: 영재고, 특성화고, 산업수요 맞춤형
  let schoolCategory = 'general';  // general | autonomous | excluded
  const stClean = schoolTypeText.replace(/\s/g, '');
  if (stClean.includes('영재') || stClean.includes('특성화') || stClean.includes('산업수요') || stClean.includes('마이스터')) {
    schoolCategory = 'excluded';
  } else if (stClean.includes('자율') || stClean.includes('특수목적') || stClean.includes('특목')) {
    schoolCategory = 'autonomous';
  } else {
    schoolCategory = 'general';
  }
  
  // 데이터 행 (4행부터, 인덱스 3)
  const dataStartRow = 3;
  
  // 컬럼 매핑 (이전에 분석한대로)
  const COL = {
    section: 0,    // 학교지정/학생선택
    area: 1,       // 교과(군)
    subject: 2,    // 과목
    type: 3,       // 과목유형 (공통/일반선택/진로선택/융합선택)
    baseCredit: 4, // 기본학점
    completion: 5, // 이수구분 (지정 / 선택군A 택7 등)
    sem: { '1-1': 6, '1-2': 7, '2-1': 8, '2-2': 9, '3-1': 10, '3-2': 11 },
    totalCredit: 12,
  };
  
  // "편성 조건 점검" 행 이후는 무시
  let endRow = expandedGrid.length;
  for (let r = dataStartRow; r < expandedGrid.length; r++) {
    const text = (expandedGrid[r] || []).join(' ');
    if (text.includes('편성 조건') && text.includes('점검')) {
      endRow = r;
      break;
    }
  }
  
  // 학기별로 과목 정리
  // 각 학기마다: { fixed: [...], choices: [{groupName, takeN, subjects: [...]}] }
  const semesters = {};
  for (const sem of Object.keys(COL.sem)) {
    semesters[sem] = {
      fixed: [],
      choiceGroups: {},  // groupName → { takeN, subjects }
    };
  }
  
  for (let r = dataStartRow; r < endRow; r++) {
    const row = expandedGrid[r] || [];
    const sectionRaw = (row[COL.section] || '').toString().trim();
    const area = (row[COL.area] || '').toString().trim();
    const subject = (row[COL.subject] || '').toString().trim();
    const type = (row[COL.type] || '').toString().trim();
    const baseCredit = parseFloat(row[COL.baseCredit]) || 0;
    const completion = (row[COL.completion] || '').toString().trim();
    
    if (!subject) continue;
    
    if (/학기별|이수학점|이수\s*과목수|창의적|체험활동|소계|합계|총계/.test(sectionRaw)) continue;
    if (/학기별|이수학점|이수\s*과목수|창의적|체험활동|소계|합계|총계/.test(subject)) continue;
    
    const isFixed = sectionRaw.includes('학교') && sectionRaw.includes('지정');
    
    // 일반 처리: 모든 행을 학기별로 분배
    // (학기교차 학교지정은 일단 두 학기 모두에 추가 → 후처리에서 페어링)
    
    // === 운영학점 셀 별도 추출 (그룹 합계용, 학기 셀과 절대 섞이면 안 됨) ===
    const totalCreditCell = (row[COL.totalCredit] || '').toString().trim();
    const totalCreditMatch = totalCreditCell.match(/(\d+(?:\.\d+)?)/);
    const rowTotalCredit = totalCreditMatch ? parseFloat(totalCreditMatch[1]) : null;
    
    for (const [semKey, semCol] of Object.entries(COL.sem)) {
      const cellVal = (row[semCol] || '').toString().trim();
      if (!cellVal) continue;
      
      const isCrossSem = cellVal.includes('학기교차') || cellVal.includes('교차');
      const isOptional = cellVal.includes('희망자만') || cellVal.includes('희망자');
      
      // === 학기 셀에서 학점 추출 ===
      // 일반: 학기 셀에 4, 3 같은 숫자 = 그 과목의 학점
      // 이문고 패턴: 학기 셀에 26 같은 큰 숫자 = 그룹 합계 (과목 학점은 다른 곳)
      const creditMatch = cellVal.match(/(\d+(?:\.\d+)?)/);
      let cellCredit = creditMatch ? parseFloat(creditMatch[1]) : null;
      
      // 학기 셀의 숫자가 baseCredit보다 비정상적으로 크면 (= 그룹 합계로 추정)
      // 그 과목의 실제 학점은 운영학점(rowTotalCredit) 또는 baseCredit에서 가져옴
      let cellHasGroupTotal = false;
      let credit;
      
      // 선택군의 "택N" 정보를 미리 파싱 (그룹 합계 추정 보조용)
      // 예: "선택군L 택2" → takeNForCredit = 2
      let takeNForCredit = null;
      if (!isFixed && completion) {
        // "택 2~3" 같은 범위는 큰 값을 사용
        const rangeM = completion.match(/택\s*\d+\s*[~∼\-–]\s*(\d+)/);
        if (rangeM) takeNForCredit = parseInt(rangeM[1]);
        else {
          const simpleM = completion.match(/택\s*(\d+)/);
          if (simpleM) takeNForCredit = parseInt(simpleM[1]);
        }
      }
      
      if (cellCredit !== null && baseCredit > 0 && cellCredit > baseCredit * 1.5) {
        // 학기 셀에 그룹 합계가 들어있는 경우 (예: 이문고 26)
        // 실제 과목 학점: 운영학점 우선, 없으면 baseCredit
        cellHasGroupTotal = true;
        credit = (rowTotalCredit !== null && rowTotalCredit <= baseCredit + 1) 
          ? rowTotalCredit 
          : baseCredit;
      } else if (isCrossSem && cellCredit !== null && cellCredit > 0) {
        // 학기교차 과목: 학기 셀에 명시된 학점을 무조건 신뢰
        // (한 학기당 학점이 적혀 있음 - 만년고 음악/미술, 중일고 생태와환경/보건, 확률과통계/정보 등)
        credit = cellCredit;
      } else if (!isFixed && takeNForCredit && takeNForCredit >= 2
                 && cellCredit !== null && baseCredit > 0
                 && cellCredit === baseCredit * takeNForCredit) {
        // 선택군의 그룹 합계가 학기 셀에 들어있고, baseCredit × 택N과 정확히 일치
        // (예: 노은고 선택군L "택2", baseCredit=2, 학기셀=4 → 4 = 2 × 2)
        // → 학기 셀은 그룹 합계, 실제 과목 학점은 baseCredit
        cellHasGroupTotal = true;
        credit = baseCredit;
      } else if (!isFixed && takeNForCredit && takeNForCredit >= 2
                 && cellCredit !== null && cellCredit > 0
                 && rowTotalCredit !== null
                 && rowTotalCredit === cellCredit * takeNForCredit) {
        // 노은고 선택군L 패턴: 학기 셀에 한 과목 학점(2)이 적혀있고,
        // 운영학점이 그룹 합계(택N×학점)인 경우
        // 예: cellCredit=2, takeN=2, rowTotalCredit=4 → 2 × 2 = 4 매칭
        // → cellCredit이 한 과목 학점
        credit = cellCredit;
      } else if (rowTotalCredit !== null && rowTotalCredit <= baseCredit + 1 && rowTotalCredit > 0) {
        // 일반(비학기교차): 운영학점이 baseCredit과 비슷하면 그것 사용
        credit = rowTotalCredit;
      } else if (cellCredit !== null) {
        credit = cellCredit;
      } else {
        credit = baseCredit;
      }
      
      const subjInfo = {
        name: subject,
        area: area,
        type: type,
        credit: credit,
        baseCredit: baseCredit,
        crossSem: isCrossSem,
        optional: isOptional,
        cellValue: cellVal,
        cellHasGroupTotal: cellHasGroupTotal,
        groupTotalFromCell: cellHasGroupTotal ? cellCredit : null,
        rowIndex: r,  // 페어링용 (시트의 원래 행 순서)
      };
      
      // === 디버깅: 학기교차 과목 모두 출력 ===
      if (isCrossSem) {
        console.log(`[학기교차 ${subject}] ${semKey} 셀값="${cellVal}" baseCredit=${baseCredit} cellCredit=${cellCredit} rowTotalCredit=${rowTotalCredit} → credit=${credit} isFixed=${isFixed}`);
      }
      
      // === 디버깅: 선택군 과목의 학점 처리 추적 ===
      // (학교/학기별 선택군 학점 오류 진단용)
      if (!isFixed && completion && completion.includes('선택군')) {
        console.log(`[선택군 ${subject}] ${semKey} 이수구분="${completion}" 학기셀="${cellVal}" baseCredit=${baseCredit} cellCredit=${cellCredit} rowTotalCredit=${rowTotalCredit} → credit=${credit}`);
      }
      
      if (isFixed) {
        semesters[semKey].fixed.push(subjInfo);
      } else {
        let groupName = '선택';
        let takeN = null;
        let takeMin = null;
        let takeMax = null;
        let takeCredit = null;  // 학점 합계 목표 (이문고 선택군C/D 패턴)
        const groupMatch = completion.match(/(선택군\s*[A-Z\d]+|[A-Z]\s*그룹|선택\s*\w+)/);
        if (groupMatch) {
          groupName = groupMatch[1].replace(/\s+/g, '');
        }
        
        // "택7~8" 또는 "택 7 ~ 8" 같은 범위 표기 우선 체크
        const rangeMatch = completion.match(/택\s*(\d+)\s*[~∼\-–]\s*(\d+)/);
        if (rangeMatch) {
          takeMin = parseInt(rangeMatch[1]);
          takeMax = parseInt(rangeMatch[2]);
          takeN = takeMax;  // 호환성: 기존 takeN은 최대값으로
          
          // === 그룹 합계 학점 추출 (이문고 선택군C/D = 26학점) ===
          // 우선순위:
          // 1순위: 학기 셀에 그룹 합계가 들어있는 경우 (이문고 패턴: 학기셀=26, baseCredit=4)
          // 2순위: 이수구분 셀의 끝에 큰 숫자 ("선택군C 택7~8 26")
          // 3순위: 운영학점 셀의 값이 takeMax보다 클 때
          
          if (cellHasGroupTotal && cellCredit > takeMax) {
            // 이문고 패턴: 학기 셀에 26이 들어있음
            takeCredit = cellCredit;
          } else {
            // 이수구분 셀에서 takeMax보다 큰 숫자 찾기
            const allNumsInCompletion = [...completion.matchAll(/(\d+)/g)].map(m => parseInt(m[1]));
            const candidatesFromCompletion = allNumsInCompletion.filter(n => n > takeMax);
            if (candidatesFromCompletion.length > 0) {
              takeCredit = Math.max(...candidatesFromCompletion);
            } else if (rowTotalCredit !== null && rowTotalCredit > takeMax) {
              takeCredit = rowTotalCredit;
            }
          }
          // 만약 어디에도 합계가 없으면 takeCredit은 null로 남음
        } else {
          // 일반 "택N" 표기
          const takeMatch = completion.match(/택\s*(\d+)/);
          if (takeMatch) {
            takeN = parseInt(takeMatch[1]);
          }
        }
        
        if (!semesters[semKey].choiceGroups[groupName]) {
          semesters[semKey].choiceGroups[groupName] = {
            name: groupName,
            takeN: takeN,
            takeMin: takeMin,
            takeMax: takeMax,
            takeCredit: takeCredit,
            subjects: [],
          };
        } else {
          // 기존 그룹에 추가 정보 보강 (시트의 첫 행에만 정보가 있고 나머지 행은 비어있음)
          const existing = semesters[semKey].choiceGroups[groupName];
          if (takeN !== null && existing.takeN === null) existing.takeN = takeN;
          if (takeMin !== null && existing.takeMin === null) existing.takeMin = takeMin;
          if (takeMax !== null && existing.takeMax === null) existing.takeMax = takeMax;
          if (takeCredit !== null && existing.takeCredit === null) existing.takeCredit = takeCredit;
        }
        semesters[semKey].choiceGroups[groupName].subjects.push(subjInfo);
      }
    }
  }
  
  // === 후처리: 학기교차 학교지정 과목 페어링 ===
  // 같은 학년의 1학기/2학기에 모두 추가된 학기교차 학교지정 과목들을 순서대로 짝지음
  // 짝수번째(0,2,4...)는 1학기, 홀수번째(1,3,5...)는 2학기에만 남김
  function pairCrossSemFixed(sem1Key, sem2Key) {
    const sem1Fixed = semesters[sem1Key].fixed;
    const sem2Fixed = semesters[sem2Key].fixed;
    
    // 학기교차 학교지정 과목들 추출 (rowIndex로 정렬)
    const sem1Cross = sem1Fixed.filter(s => s.crossSem).sort((a,b) => a.rowIndex - b.rowIndex);
    const sem2Cross = sem2Fixed.filter(s => s.crossSem).sort((a,b) => a.rowIndex - b.rowIndex);
    
    // 시트에서 학기교차로 표시되어 두 학기 모두에 들어간 과목들
    // (rowIndex가 sem1과 sem2 양쪽에 있는 것들)
    const sem1RowIdx = new Set(sem1Cross.map(s => s.rowIndex));
    const sem2RowIdx = new Set(sem2Cross.map(s => s.rowIndex));
    const commonRowIdx = [...sem1RowIdx].filter(idx => sem2RowIdx.has(idx)).sort((a,b) => a - b);
    
    // 순서대로 페어링: 짝수번째는 1학기, 홀수번째는 2학기에만 남김
    commonRowIdx.forEach((rowIdx, i) => {
      if (i % 2 === 0) {
        // 1학기에 남기고, 2학기에서 제거
        const idx = semesters[sem2Key].fixed.findIndex(s => s.rowIndex === rowIdx);
        if (idx >= 0) semesters[sem2Key].fixed.splice(idx, 1);
      } else {
        // 2학기에 남기고, 1학기에서 제거
        const idx = semesters[sem1Key].fixed.findIndex(s => s.rowIndex === rowIdx);
        if (idx >= 0) semesters[sem1Key].fixed.splice(idx, 1);
      }
    });
  }
  
  pairCrossSemFixed('1-1', '1-2');
  pairCrossSemFixed('2-1', '2-2');
  pairCrossSemFixed('3-1', '3-2');
  
  // === 학기별 교과 이수 학점 (합계 행) 추출 ===
  // 시트의 "학기별 교과 이수 학점" 행에서 각 학기별 학점 가져옴
  // 또한 운영학점(M열) 합도
  const semesterTargets = { '1-1': 0, '1-2': 0, '2-1': 0, '2-2': 0, '3-1': 0, '3-2': 0 };
  let totalCurriculumCredits = 0;  // 교과 이수 학점 합 (174 비교용)
  
  for (let r = dataStartRow; r < expandedGrid.length; r++) {
    const row = expandedGrid[r] || [];
    const sectionText = (row[COL.section] || '').toString();
    const subjectText = (row[COL.subject] || '').toString();
    
    // "학기별 교과 이수 학점" 행 매칭
    const combined = sectionText + ' ' + subjectText;
    if (/학기별\s*교과\s*이수\s*학점/.test(combined.replace(/\s/g, ''))) {
      // 이 행의 학기별 값 추출
      for (const [semKey, semCol] of Object.entries(COL.sem)) {
        const v = parseFloat((row[semCol] || '').toString().match(/(\d+(?:\.\d+)?)/)?.[1]);
        if (!isNaN(v)) semesterTargets[semKey] = v;
      }
      // 운영학점(M열, 인덱스 12)
      const totalV = parseFloat((row[COL.totalCredit] || '').toString().match(/(\d+(?:\.\d+)?)/)?.[1]);
      if (!isNaN(totalV)) totalCurriculumCredits = totalV;
      break;
    }
  }
  
  console.log('학기별 목표 학점:', semesterTargets);
  console.log('총 교과 이수 학점:', totalCurriculumCredits);
  
  // === 선택군 학점 합계(takeCredit) 진단 ===
  // 이문고 선택군C/D 같은 패턴 확인
  const groupsWithCredit = [];
  for (const [semKey, semData] of Object.entries(semesters)) {
    for (const [groupName, group] of Object.entries(semData.choiceGroups)) {
      if (group.takeCredit !== null && group.takeCredit !== undefined) {
        // 첫 5개 과목의 학점 표시 (학점 잘 들어왔는지 확인)
        const first5 = group.subjects.slice(0, 5).map(s => ({
          과목명: s.name,
          학점: s.credit,
          기본학점: s.baseCredit,
          시트셀: s.cellValue,
        }));
        groupsWithCredit.push({
          학기: semKey,
          그룹명: groupName,
          'takeMin~Max': `${group.takeMin}~${group.takeMax}`,
          목표학점: group.takeCredit,
          전체과목수: group.subjects.length,
          첫5과목: first5,
        });
      }
    }
  }
  
  if (groupsWithCredit.length > 0) {
    console.log('%c[선택군 진단] 학점 합계 패턴 그룹 (이문고 선택군C/D 등):', 'background: #FEF3C7; color: #92400E; font-weight: bold; padding: 4px 8px;');
    for (const g of groupsWithCredit) {
      console.log(`📌 ${g.학기} ${g.그룹명}: 택${g['takeMin~Max']} 목표${g.목표학점}학점 (총 ${g.전체과목수}과목)`);
      console.table(g.첫5과목);
    }
  }
  
  // === 전체 선택군 학점 일관성 진단 ===
  // 같은 그룹 안의 과목들 학점이 비정상적으로 다르면 경고
  // (노은고 선택군L 같은 케이스 자동 탐지)
  const inconsistentGroups = [];
  for (const [semKey, semData] of Object.entries(semesters)) {
    for (const [groupName, group] of Object.entries(semData.choiceGroups)) {
      if (group.subjects.length < 2) continue;
      const credits = group.subjects.map(s => s.credit);
      const uniqueCredits = [...new Set(credits)];
      const maxC = Math.max(...credits);
      const minC = Math.min(...credits);
      
      // 같은 선택군인데 학점 편차가 너무 크면 의심 (보통 한 그룹은 같은 학점)
      if (maxC > minC * 1.5 && uniqueCredits.length > 1) {
        inconsistentGroups.push({
          학기: semKey,
          그룹명: groupName,
          학점분포: uniqueCredits.sort((a,b) => a-b).join(', '),
          과목수: group.subjects.length,
          예시: group.subjects.slice(0, 4).map(s => `${s.name}(${s.credit})`).join(', '),
        });
      }
    }
  }
  
  if (inconsistentGroups.length > 0) {
    console.log('%c[선택군 진단] 학점 편차가 큰 선택군 (확인 필요):', 'background: #FEE2E2; color: #991B1B; font-weight: bold; padding: 4px 8px;');
    console.table(inconsistentGroups);
  }
  
  // === 그룹 전체 학점이 baseCredit × takeN과 일치하는지 검증 ===
  // (노은고 선택군L 패턴: 택2, 각 과목 2학점이어야 그룹 합계 4학점)
  const groupCreditChecks = [];
  for (const [semKey, semData] of Object.entries(semesters)) {
    for (const [groupName, group] of Object.entries(semData.choiceGroups)) {
      if (!group.takeN || group.subjects.length === 0) continue;
      const firstCredit = group.subjects[0].credit;
      const expectedTotal = firstCredit * group.takeN;
      
      // 시트에 명시된 목표 학점이 있다면 비교
      if (group.takeCredit !== null && group.takeCredit !== undefined
          && group.takeCredit !== expectedTotal) {
        groupCreditChecks.push({
          학기: semKey,
          그룹명: groupName,
          '택N': group.takeN,
          첫과목학점: firstCredit,
          예상합계: expectedTotal,
          실제목표: group.takeCredit,
          불일치: '⚠️',
        });
      }
    }
  }
  
  if (groupCreditChecks.length > 0) {
    console.log('%c[선택군 진단] 택N × 과목학점 ≠ 목표학점 (시트 확인 필요):', 'background: #FEE2E2; color: #991B1B; font-weight: bold; padding: 4px 8px;');
    console.table(groupCreditChecks);
  }
  
  // === 통합교과군(기술·가정/정보/제2외국어/한문/교양) 분류 진단 ===
  // 이건 디버그 모드 아니어도 항상 출력 (이슈 진단용)
  const techMembers = ['기술', '가정', '정보', '외국어', '한문', '교양'];
  const techCandidates = [];
  for (const [semKey, semData] of Object.entries(semesters)) {
    for (const subj of semData.fixed) {
      const a = (subj.area || '').replace(/\s/g, '');
      if (techMembers.some(m => a.includes(m))) {
        techCandidates.push({ 학기: semKey, 영역: '학교지정', 과목명: subj.name, 시트area: subj.area, 분류결과: classifyArea(subj.area), 학점: subj.credit });
      }
    }
    for (const [groupName, group] of Object.entries(semData.choiceGroups)) {
      for (const subj of group.subjects) {
        const a = (subj.area || '').replace(/\s/g, '');
        if (techMembers.some(m => a.includes(m))) {
          techCandidates.push({ 학기: semKey, 영역: `학생선택(${groupName})`, 과목명: subj.name, 시트area: subj.area, 분류결과: classifyArea(subj.area), 학점: subj.credit });
        }
      }
    }
  }
  
  if (techCandidates.length > 0) {
    console.log('%c[교과군 진단] 기술·가정/정보/제2외국어/한문/교양 후보 과목들:', 'background: #DCFCE7; color: #15803D; font-weight: bold; padding: 4px 8px;');
    console.table(techCandidates);
    
    const wrongClassified = techCandidates.filter(s => s.분류결과 !== '기술교양');
    if (wrongClassified.length > 0) {
      console.warn('%c⚠ 기술교양인데 다른 교과군으로 잘못 분류된 과목:', 'background: #FEE2E2; color: #991B1B; font-weight: bold; padding: 4px 8px;');
      console.table(wrongClassified);
    }
  }
  
  // === 디버그: 모든 과목의 area 분류 출력 (?debug=1) ===
  if (IS_DEBUG) {
    console.log('%c=== 디버그: 과목별 교과군 분류 ===', 'background: #FEF3C7; color: #92400E; font-weight: bold; padding: 4px 8px;');
    console.log('학교 유형:', schoolTypeText, '→ 분류:', schoolCategory);
    console.log('필수 이수 학점 기준:', schoolCategory === 'autonomous' 
      ? '예술 5학점, 기술교양 12학점' 
      : '예술 10학점, 기술교양 16학점');
    
    const allSubjects = [];
    const areaSummary = { '국어': 0, '수학': 0, '영어': 0, '사회': 0, '과학': 0, '체육': 0, '예술': 0, '기술교양': 0, 'unknown': 0 };
    
    for (const [semKey, semData] of Object.entries(semesters)) {
      // 학교지정
      for (const subj of semData.fixed) {
        const cat = classifyArea(subj.area);
        allSubjects.push({ 학기: semKey, 영역: '학교지정', 과목명: subj.name, 시트area: subj.area, 분류: cat, 학점: subj.credit });
        areaSummary[cat] += subj.credit;
      }
      // 학생선택
      for (const [groupName, group] of Object.entries(semData.choiceGroups)) {
        for (const subj of group.subjects) {
          const cat = classifyArea(subj.area);
          allSubjects.push({ 학기: semKey, 영역: `학생선택(${groupName})`, 과목명: subj.name, 시트area: subj.area, 분류: cat, 학점: subj.credit });
          // 학생선택은 합계에 안 넣음 (선택 안 했을 수도 있으니)
        }
      }
    }
    
    console.table(allSubjects);
    console.log('%c학교지정만 합한 교과군별 학점 (참고):', 'color: #5392BE; font-weight: bold;', areaSummary);
    
    // unknown으로 분류된 과목들 따로 강조
    const unknownSubjects = allSubjects.filter(s => s.분류 === 'unknown');
    if (unknownSubjects.length > 0) {
      console.warn('%c⚠ 분류되지 않은(unknown) 과목들:', 'background: #FEE2E2; color: #991B1B; font-weight: bold; padding: 2px 6px;');
      console.table(unknownSubjects);
    }
    
    // 기술교양으로 분류된 과목들 따로
    const techSubjects = allSubjects.filter(s => s.분류 === '기술교양');
    console.log('%c기술·가정/정보/제2외국어/한문/교양 분류된 과목들:', 'color: #15803D; font-weight: bold;');
    console.table(techSubjects);
  }
  
  return { 
    semesters,
    schoolType: schoolTypeText,
    schoolCategory,  // 'general' | 'autonomous' | 'excluded'
    semesterTargets,  // {1-1: 28, 1-2: 28, ...} (기본값 - 희망자만 미선택 기준)
    totalCurriculumCredits,  // 174 또는 그 이상 (기본값)
    baseSemesterTargets: { ...semesterTargets },  // 변경 안 되는 원본
    baseTotalCurriculumCredits: totalCurriculumCredits,  // 변경 안 되는 원본
  };
}

// 진로 추천 검사
// ============================================
// 추천 여부 - 시트의 교과(군) 컬럼 기반 + 학교별 예외 규칙
// 인자: subjectName(과목명), subjectArea(시트의 "교과(군)" 원본 값), semKey(학기, 예외 규칙용)
function isRecommended(subjectName, subjectArea, semKey) {
  if (!state.career || state.career === '모르겠음') return false;
  const rec = CAREER_RECOMMEND[state.career];
  if (!rec) return false;
  
  // === 학교별 예외 규칙 먼저 검사 ===
  // SCHOOL_NAME은 "대전둔산여자고" 또는 "학교명_학과" 형식일 수 있어
  // 학과 부분 제거하여 학교명만으로 매칭
  const schoolKey = SCHOOL_NAME.split('_')[0];
  const schoolOverride = SCHOOL_RECOMMEND_OVERRIDES[schoolKey];
  if (schoolOverride && schoolOverride[state.career] && semKey) {
    const careerOverride = schoolOverride[state.career];
    
    // remove 규칙: 기본은 추천이지만 빼야 할 과목 → 무조건 false
    if (careerOverride.remove && careerOverride.remove[semKey]) {
      if (matchesOverride(subjectName, careerOverride.remove[semKey])) {
        return false;
      }
    }
    
    // add 규칙: 기본은 추천 안 되지만 추가로 추천할 과목 → 무조건 true
    if (careerOverride.add && careerOverride.add[semKey]) {
      if (matchesOverride(subjectName, careerOverride.add[semKey])) {
        return true;
      }
    }
  }
  
  // === 기본 교과군 기반 추천 ===
  if (!subjectArea) return false;
  
  // classifyArea로 정규화된 교과군 (예: '국어', '수학', '기술교양' 등)
  const classified = classifyArea(subjectArea);
  
  // 1) 분류된 교과군이 추천 areas에 들어있으면 추천
  if (rec.areas && rec.areas.includes(classified)) return true;
  
  // 2) 통합교과군('기술교양')의 경우, 원본 area 텍스트에 특정 단어가 있는지 추가 검사
  if (rec.rawAreaIncludes && rec.rawAreaIncludes.length > 0) {
    const rawArea = subjectArea.replace(/\s/g, '').replace(/·/g, '');
    for (const keyword of rec.rawAreaIncludes) {
      if (rawArea.includes(keyword)) return true;
    }
  }
  
  return false;
}

const SUNEUNG_SUBJECTS = [
  '화법과 언어', '독서와 작문', '문학',
  '대수', '미적분Ⅰ', '확률과 통계',
  '한국사1', '한국사2',
  '통합사회1', '통합사회2',
  '통합과학1', '통합과학2',
  '영어Ⅰ', '영어Ⅱ',
];

function isSuneung(subjectName) {
  // 정규화 (공백, 로마 숫자 처리)
  const normalize = (s) => s.replace(/\s/g, '')
    .replace(/Ⅰ/g, '1').replace(/Ⅱ/g, '2').replace(/Ⅲ/g, '3')
    .replace(/I+/g, m => m.length.toString());
  
  const normalizedName = normalize(subjectName);
  
  return SUNEUNG_SUBJECTS.some(s => normalize(s) === normalizedName);
}

// ============================================
// 교육과정 편성 점검 (대전광역시 고시 제2024-15호 기준)
// ============================================

// 교과군 분류: 시트의 area 텍스트 → 표준 교과군 키
// 시트의 area(교과군) 텍스트를 표준 교과군 키로 변환
// 핵심 원칙: PDF 학점 배당 기준 표의 정확한 교과군명을 기준으로 매칭
// 표준 교과군: 국어, 수학, 영어, 사회(역사/도덕 포함), 과학, 체육, 예술, 기술·가정/정보/제2외국어/한문/교양
function classifyArea(area) {
  if (!area) return 'unknown';
  
  // 공백 제거 + 정규화
  const a = area.replace(/\s/g, '').replace(/·/g, '').replace(/[()]/g, '');
  
  // === 1단계: 통합 교과군 (가장 먼저 체크 - 슬래시 표기는 통합 교과군의 특징) ===
  // "기술·가정/정보/제2외국어/한문/교양" 또는 부분 표기들
  // 슬래시(/)가 있고 구성요소 중 하나라도 들어있으면 기술교양으로 확정
  const techMembers = ['기술가정', '기술', '가정', '정보', '제2외국어', '제2', '2외', '외국어', '한문', '교양'];
  if (a.includes('/')) {
    // 슬래시 포함 → 통합교과군 후보
    for (const m of techMembers) {
      if (a.includes(m)) {
        // 단, "사회/역사" 같은 사회 교과군 슬래시 표기와 구분
        if (a.includes('사회') || a.includes('역사') || a.includes('도덕')) break;
        return '기술교양';
      }
    }
  }
  
  // === 2단계: 단일 교과군 정확 매칭 ===
  // area가 정확히 해당 교과군명과 일치하는 경우
  
  // 사회 교과군 (역사, 도덕, 한국사 포함)
  if (a === '사회' || a === '역사' || a === '도덕' || a === '한국사'
      || a === '사회역사도덕' || a === '사회/역사/도덕'.replace(/\//g, '')
      || /^(사회|역사|도덕|한국사)/.test(a)) return '사회';
  
  // 국어
  if (a === '국어' || /^국어/.test(a)) return '국어';
  
  // 수학
  if (a === '수학' || /^수학/.test(a)) return '수학';
  
  // 영어
  if (a === '영어' || /^영어/.test(a)) return '영어';
  
  // 과학
  if (a === '과학' || /^과학/.test(a)) return '과학';
  
  // 체육
  if (a === '체육' || /^체육/.test(a)) return '체육';
  
  // 예술 (음악, 미술 포함)
  if (a === '예술' || a === '음악' || a === '미술'
      || a === '예술음악미술'
      || /^(예술|음악|미술)/.test(a)) return '예술';
  
  // === 3단계: 기술교양 통합 교과군 - 슬래시 없는 단독 표기 ===
  // 기술·가정, 정보, 제2외국어, 한문, 교양 등이 단독으로 적혀있는 경우
  if (a === '기술가정' || a === '기술' || a === '가정'
      || a === '정보'
      || a === '제2외국어' || a === '2외국어' || a === '외국어'
      || a === '한문'
      || a === '교양') return '기술교양';
  
  // === 4단계: 부분 매칭 폴백 (덜 확실) ===
  // 표준 교과군명 키워드가 area에 포함되어 있으면 그것으로 판정
  // 단, 통합교과군 멤버 검사를 먼저 해서 "한문 (국어과)" 같은 경우도 기술교양으로
  if (a.includes('기술가정') || a.includes('기술·가정')
      || a.includes('제2외국어') || a.includes('한문') || a.includes('교양')) {
    return '기술교양';
  }
  if (a.includes('국어')) return '국어';
  if (a.includes('수학')) return '수학';
  if (a.includes('영어')) return '영어';
  if (a.includes('사회') || a.includes('역사') || a.includes('도덕') || a.includes('한국사')) return '사회';
  if (a.includes('과학')) return '과학';
  if (a.includes('체육')) return '체육';
  if (a.includes('예술') || a.includes('음악') || a.includes('미술')) return '예술';
  if (a.includes('기술') || a.includes('가정') || a.includes('정보')
      || a.includes('외국어') || a.includes('제2') || a.includes('2외')) {
    return '기술교양';
  }
  
  return 'unknown';
}

// 학교 카테고리별 필수 이수 학점 기준
function getRequirements(schoolCategory) {
  const base = {
    '국어': 8,
    '수학': 8,
    '영어': 8,
    '사회': 14,  // 한국사 6 + 통합사회 8
    '과학': 10,
    '체육': 10,
    '예술': schoolCategory === 'autonomous' ? 5 : 10,
    '기술교양': schoolCategory === 'autonomous' ? 12 : 16,
  };
  return base;
}

// 학생이 희망자만 그룹에서 선택한 추가 학점을 학기별로 계산
// (시트의 기본 학기 학점에 더해질 추가량)
function computeOptionalExtra(state, curriculumData) {
  const SKIP_KEY = '__SKIP__';
  const extra = { '1-1': 0, '1-2': 0, '2-1': 0, '2-2': 0, '3-1': 0, '3-2': 0 };
  
  for (const [semKey, semData] of Object.entries(curriculumData.semesters)) {
    const sel = state.selections[semKey];
    if (!sel || !sel.choices) continue;
    
    for (const [groupName, group] of Object.entries(semData.choiceGroups)) {
      // 그룹 전체가 희망자만이어야 추가 학점으로 계산
      const allOptional = group.subjects.length > 0 && group.subjects.every(s => s.optional);
      if (!allOptional) continue;
      
      const choices = sel.choices[groupName] || [];
      for (const name of choices) {
        if (name === SKIP_KEY) continue;
        const subj = group.subjects.find(s => s.name === name);
        if (subj) extra[semKey] += subj.credit;
      }
    }
  }
  
  return extra;
}

// 동적으로 변경되는 학기 목표 + 총 교과 학점 계산
// 기본값(시트) + 희망자만 그룹에서 선택한 추가 학점
function getEffectiveTargets(state, curriculumData) {
  const extra = computeOptionalExtra(state, curriculumData);
  const base = curriculumData.baseSemesterTargets || curriculumData.semesterTargets;
  const baseTotal = curriculumData.baseTotalCurriculumCredits || curriculumData.totalCurriculumCredits;
  
  const effectiveSemesterTargets = {};
  let totalExtra = 0;
  for (const [semKey, val] of Object.entries(base)) {
    effectiveSemesterTargets[semKey] = val + (extra[semKey] || 0);
    totalExtra += (extra[semKey] || 0);
  }
  const effectiveTotal = baseTotal + totalExtra;
  
  return {
    semesterTargets: effectiveSemesterTargets,
    totalCurriculumCredits: effectiveTotal,
    extra,  // 학기별 추가 학점 (디버깅용)
  };
}

// 현재 선택 상태 기반으로 학기별 학점/교과군별 학점 계산
function computeStats(state, curriculumData) {
  const semCredits = { '1-1': 0, '1-2': 0, '2-1': 0, '2-2': 0, '3-1': 0, '3-2': 0 };
  const areaCredits = {
    '국어': 0, '수학': 0, '영어': 0, '사회': 0,
    '과학': 0, '체육': 0, '예술': 0, '기술교양': 0,
    '한국사': 0,  // 사회의 일부지만 별도 추적
  };
  let totalCredits = 0;
  
  // 한국사 인지 판별
  const isKoreanHistory = (subjectName) => {
    const n = (subjectName || '').replace(/\s/g, '');
    return n.includes('한국사');
  };
  
  for (const sem of SEMESTERS) {
    const semKey = sem.key;
    const sel = state.selections[semKey];
    if (!sel) continue;
    const semData = curriculumData.semesters[semKey];
    if (!semData) continue;
    
    // 학교지정 (자동 선택)
    for (const subj of semData.fixed) {
      semCredits[semKey] += subj.credit;
      totalCredits += subj.credit;
      const area = classifyArea(subj.area);
      if (area in areaCredits) areaCredits[area] += subj.credit;
      // 한국사 별도 합산 (사회와 중복 합산은 OK - 표시용)
      if (isKoreanHistory(subj.name)) {
        areaCredits['한국사'] += subj.credit;
      }
    }
    // 학생선택
    for (const [groupName, names] of Object.entries(sel.choices || {})) {
      const group = semData.choiceGroups[groupName];
      if (!group) continue;
      for (const name of names) {
        const subj = group.subjects.find(s => s.name === name);
        if (!subj) continue;
        semCredits[semKey] += subj.credit;
        totalCredits += subj.credit;
        const area = classifyArea(subj.area);
        if (area in areaCredits) areaCredits[area] += subj.credit;
        if (isKoreanHistory(subj.name)) {
          areaCredits['한국사'] += subj.credit;
        }
      }
    }
  }
  
  return { semCredits, areaCredits, totalCredits };
}

// 국·수·영 상한 계산
function calcKMECapacity(totalCurriculumCredits) {
  // 174학점 이하 → 81학점
  // 174학점 초과 → 81 + (총학점 - 174) * 0.5
  if (totalCurriculumCredits <= 174) return 81;
  const extra = totalCurriculumCredits - 174;
  return 81 + extra * 0.5;
}

// 한 학기의 점검 (실시간용) - 위반 발견 시 다음 학기로 못 넘어가게
// 반환: {ok, errors[]}
function validateSemester(semKey, state, curriculumData) {
  const errors = [];
  const stats = computeStats(state, curriculumData);
  const effective = getEffectiveTargets(state, curriculumData);
  
  // (1) 학기별 학점이 목표와 일치하는지 (이 학기 기준)
  const target = effective.semesterTargets[semKey];
  const current = stats.semCredits[semKey];
  if (target > 0 && current !== target) {
    if (current < target) {
      errors.push({
        type: 'semester_credit_under',
        message: `현재까지 ${current}학점까지만 선택했어요. ${target - current}학점 더 선택해주세요.`,
      });
    } else {
      errors.push({
        type: 'semester_credit_over',
        message: `이 학기 학점을 초과했어요 (${current}/${target}학점). ${current - target}학점을 줄여주세요.`,
      });
    }
  }
  
  // (2) 국·수·영 상한 (실시간 누적 점검)
  const kmeTotal = stats.areaCredits['국어'] + stats.areaCredits['수학'] + stats.areaCredits['영어'];
  const kmeMax = calcKMECapacity(effective.totalCurriculumCredits);
  if (kmeTotal > kmeMax) {
    errors.push({
      type: 'kme_over',
      message: `국어·수학·영어 교과의 선택 학점 총합이 ${kmeTotal}학점으로 상한(${kmeMax}학점)을 초과해요. 다른 교과를 선택해주세요.`,
    });
  }
  
  // (3) 선택군별 점검 (개수 + 학점 합계)
  const semData = curriculumData.semesters[semKey];
  if (semData && semData.choiceGroups) {
    const sel = state.selections[semKey];
    if (sel && sel.choices) {
      const SKIP_KEY = '__SKIP__';
      for (const [groupName, group] of Object.entries(semData.choiceGroups)) {
        const allChoices = sel.choices[groupName] || [];
        const isSkipped = allChoices.includes(SKIP_KEY);
        const choices = allChoices.filter(n => n !== SKIP_KEY);  // 가상 옵션 제외
        
        // 그룹의 모든 과목이 "희망자만"인지 확인
        const allOptional = group.subjects.length > 0 && group.subjects.every(s => s.optional);
        const isOptIn = allOptional;
        
        // 희망자만 그룹: "선택 안함" 선택 → 검증 통과
        if (isOptIn && isSkipped) continue;
        
        // 희망자만 그룹: 아무것도 선택 안 함 → 검증 통과 (일반 선택)
        if (isOptIn && choices.length === 0) continue;
        
        if (choices.length === 0) continue;  // 일반 그룹: 선택 안 했으면 패스
        
        const selectedCredits = choices.reduce((sum, name) => {
          const s = group.subjects.find(x => x.name === name);
          return sum + (s ? s.credit : 0);
        }, 0);
        
        // 패턴 3 (이문고): 범위 + 학점 합계
        if (group.takeMin !== null && group.takeMin !== undefined 
            && group.takeMax !== null && group.takeMax !== undefined
            && group.takeCredit !== null && group.takeCredit !== undefined) {
          
          if (choices.length < group.takeMin) {
            errors.push({
              type: 'group_count_under',
              message: `${groupName}는 ${group.takeMin}~${group.takeMax}과목을 선택해야 해요 (현재 ${choices.length}과목).`,
            });
          } else if (choices.length > group.takeMax) {
            errors.push({
              type: 'group_count_over',
              message: `${groupName}는 ${group.takeMin}~${group.takeMax}과목을 선택해야 해요 (현재 ${choices.length}과목).`,
            });
          }
          
          if (selectedCredits !== group.takeCredit) {
            const diff = group.takeCredit - selectedCredits;
            if (diff > 0) {
              errors.push({
                type: 'group_credit_under',
                message: `${groupName}의 학점 합계가 ${selectedCredits}학점이에요. 정확히 ${group.takeCredit}학점이 되도록 ${diff}학점을 더 선택하거나 다른 조합으로 바꿔주세요.`,
              });
            } else {
              errors.push({
                type: 'group_credit_over',
                message: `${groupName}의 학점 합계가 ${selectedCredits}학점이에요. 정확히 ${group.takeCredit}학점이 되도록 다른 조합으로 바꿔주세요.`,
              });
            }
          }
        }
        // 패턴 1: 단순 takeN (이미 takeMax 체크 안 했고 takeN만 있는 경우)
        else if (group.takeN !== null && group.takeN !== undefined) {
          if (choices.length !== group.takeN) {
            if (choices.length < group.takeN) {
              errors.push({
                type: 'group_count_under',
                message: `${groupName}는 ${group.takeN}과목을 선택해야 해요 (현재 ${choices.length}과목).`,
              });
            }
            // 초과는 클릭 차단으로 막혀서 발생 안 함
          }
        }
      }
    }
  }
  
  return { ok: errors.length === 0, errors, stats };
}

// 종합 점검 (Step 8) - 체크리스트
// 반환: {passed[], failed[], stats}
function validateAll(state, curriculumData) {
  const stats = computeStats(state, curriculumData);
  const effective = getEffectiveTargets(state, curriculumData);
  const checks = [];
  
  // (1) 각 학기별 학점 일치
  for (const sem of SEMESTERS) {
    const target = effective.semesterTargets[sem.key];
    const current = stats.semCredits[sem.key];
    if (target > 0) {
      checks.push({
        title: `${sem.label} 학점 ${target}학점 충족`,
        passed: current === target,
        detail: `현재 ${current}학점 / 목표 ${target}학점`,
      });
    }
  }
  
  // (2) 국·수·영 상한
  const kmeTotal = stats.areaCredits['국어'] + stats.areaCredits['수학'] + stats.areaCredits['영어'];
  const kmeMax = calcKMECapacity(effective.totalCurriculumCredits);
  checks.push({
    title: `국·수·영 ${kmeMax}학점 이내`,
    passed: kmeTotal <= kmeMax,
    detail: `현재 ${kmeTotal}학점 / 상한 ${kmeMax}학점` 
            + (effective.totalCurriculumCredits > 174 ? ` (총 ${effective.totalCurriculumCredits}학점이라 상한 ${kmeMax}로 완화)` : ''),
  });
  
  // (3) 교과군별 필수 이수 학점
  if (curriculumData.schoolCategory !== 'excluded') {
    const reqs = getRequirements(curriculumData.schoolCategory);
    // 표시 순서: 국어, 수학, 영어, 한국사, 사회, 과학, 체육, 예술, 기술교양
    const checkOrder = [
      { key: '국어', label: '국어 교과군', required: reqs['국어'] },
      { key: '수학', label: '수학 교과군', required: reqs['수학'] },
      { key: '영어', label: '영어 교과군', required: reqs['영어'] },
      { key: '한국사', label: '한국사', required: 6 },
      { key: '사회', label: '사회(역사/도덕 포함) 교과군', required: reqs['사회'] },
      { key: '과학', label: '과학 교과군', required: reqs['과학'] },
      { key: '체육', label: '체육 교과군', required: reqs['체육'] },
      { key: '예술', label: '예술 교과군', required: reqs['예술'] },
      { key: '기술교양', label: '기술·가정/정보/제2외국어/한문/교양 교과군', required: reqs['기술교양'] },
    ];
    
    for (const { key, label, required } of checkOrder) {
      const current = stats.areaCredits[key] || 0;
      checks.push({
        title: `${label} ${required}학점 이상`,
        passed: current >= required,
        detail: `현재 ${current}학점 / 필요 ${required}학점`,
      });
    }
  }
  
  return { 
    checks, 
    passed: checks.filter(c => c.passed),
    failed: checks.filter(c => !c.passed),
    stats,
    schoolCategory: curriculumData.schoolCategory,
  };
}

// ============================================
// 과목 설명 가져오기
// ============================================
function getSubjectDescription(subjectName) {
  if (!state.subjectLookup) return null;
  
  // 직접 매칭
  if (state.subjectLookup[subjectName]) {
    return state.subjectLookup[subjectName].description;
  }
  
  // 정규화 매칭 (공백 제거 + Ⅰ/Ⅱ 변환)
  const normalize = (s) => s.replace(/\s/g, '').replace(/Ⅰ/g, '1').replace(/Ⅱ/g, '2').replace(/Ⅲ/g, '3');
  const normalized = normalize(subjectName);
  if (state.subjectLookup[normalized]) {
    return state.subjectLookup[normalized].description;
  }
  
  // 부분 매칭
  for (const [key, val] of Object.entries(state.subjectLookup)) {
    if (normalize(key) === normalized) {
      return val.description;
    }
  }
  
  return null;
}

// 단계별 렌더링
// ============================================
function renderStep(scrollToTop = true) {
  // 진행률 업데이트
  const stepNum = state.currentStep;
  document.getElementById('stepNum').textContent = stepNum;
  document.getElementById('progressFill').style.width = `${(stepNum / 8) * 100}%`;
  
  const stepLabels = ['진로 선택', '1학년 1학기', '1학년 2학기', '2학년 1학기', '2학년 2학기', '3학년 1학기', '3학년 2학기', '결과 확인'];
  document.getElementById('stepLabel').textContent = stepLabels[stepNum - 1] || '';
  
  // 📊 GA4 이벤트: 시뮬레이터 단계 진입 (이탈 분석용)
  if (typeof gtag === 'function') {
    gtag('event', 'simulator_step', {
      'step_number': stepNum,
      'step_name': stepLabels[stepNum - 1] || '',
      'school_name': SCHOOL_NAME || '미지정',
      'career': state.career || '미선택'
    });
  }
  
  // 콘텐츠 렌더
  const content = document.getElementById('stepContent');
  
  if (stepNum === 1) {
    content.innerHTML = renderCareerStep();
    bindCareerCardEvents();
  } else if (stepNum >= 2 && stepNum <= 7) {
    const semesterIdx = stepNum - 2;
    const sem = SEMESTERS[semesterIdx];
    content.innerHTML = renderSemesterStep(sem);
    bindSemesterEvents(sem);
  } else if (stepNum === 8) {
    content.innerHTML = renderResultStep();
    bindResultEvents();
  }
  
  // 상단 고정 사이드바 업데이트 (학기 진행 중에만 표시)
  updateStatusSummary(stepNum);
  
  if (scrollToTop) {
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }
}

// ============================================
// 상단 고정 사이드바 업데이트
// ============================================
function updateStatusSummary(stepNum) {
  const wrap = document.getElementById('statusSummary');
  // 진로 선택(1) / 결과(8)에선 숨김
  if (stepNum < 2 || stepNum > 7 || !state.curriculumData) {
    wrap.style.display = 'none';
    return;
  }
  wrap.style.display = 'block';
  
  const stats = computeStats(state, state.curriculumData);
  const effective = getEffectiveTargets(state, state.curriculumData);
  const targets = effective.semesterTargets;
  const totalTarget = effective.totalCurriculumCredits;
  
  // 국·수·영 합계와 상한
  const kme = stats.areaCredits['국어'] + stats.areaCredits['수학'] + stats.areaCredits['영어'];
  const kmeMax = calcKMECapacity(effective.totalCurriculumCredits);
  const kmeOver = kme > kmeMax;
  
  const isExcluded = state.curriculumData.schoolCategory === 'excluded';
  const reqs = isExcluded ? null : getRequirements(state.curriculumData.schoolCategory);
  
  const totalProgress = totalTarget > 0 ? `${stats.totalCredits}/${totalTarget}` : `${stats.totalCredits}`;
  
  // 상태바 항목 만들기
  const items = [];
  
  // 1. 총 학점
  const totalComplete = totalTarget > 0 && stats.totalCredits === totalTarget;
  items.push(`
    <div class="item ${totalComplete ? 'complete' : ''}">
      <span class="label">총 교과 학점</span>
      <span class="value">${totalProgress}${totalComplete ? ' ✓' : ''}</span>
    </div>
  `);
  
  // 2. 국·수·영 합산 상한
  items.push(`
    <div class="item ${kmeOver ? 'over' : ''}">
      <span class="label">국·수·영</span>
      <span class="value">${kme}/${kmeMax}${kmeOver ? ' ⚠' : ''}</span>
    </div>
  `);
  
  // 3. 교과군별 필수 이수 학점
  if (!isExcluded && reqs) {
    // 표시 순서: 국어, 수학, 영어, 한국사(6), 사회(통합사회 포함, 14), 과학, 체육, 예술, 기술교양
    const order = [
      { key: '국어', label: '국어', required: reqs['국어'] },
      { key: '수학', label: '수학', required: reqs['수학'] },
      { key: '영어', label: '영어', required: reqs['영어'] },
      { key: '한국사', label: '한국사', required: 6 },
      { key: '사회', label: '사회', required: reqs['사회'] },
      { key: '과학', label: '과학', required: reqs['과학'] },
      { key: '체육', label: '체육', required: reqs['체육'] },
      { key: '예술', label: '예술', required: reqs['예술'] },
      { key: '기술교양', label: '기술·가정/정보/제2외국어/한문/교양', required: reqs['기술교양'] },
    ];
    
    for (const { key, label, required } of order) {
      const current = stats.areaCredits[key] || 0;
      const isComplete = current >= required;
      items.push(`
        <div class="item ${isComplete ? 'complete' : 'shortage'}">
          <span class="label">${label}</span>
          <span class="value">${current}/${required}${isComplete ? ' ✓' : ''}</span>
        </div>
      `);
    }
  } else if (isExcluded) {
    items.push(`
      <div class="item">
        <span class="label" style="color: var(--text-mid);">이 학교 유형은 별도 학점 배당 기준이 적용돼요</span>
      </div>
    `);
  }
  
  document.getElementById('statusQuick').innerHTML = items.join('');
}

// === 동일 과목 중복 선택 차단 ===
// 다른 학기에 이미 같은 이름의 과목이 선택되어 있는지 확인
// (학교지정 과목 + 학생선택 과목 모두 포함, 단 현재 학기는 제외)
function findDuplicateSemester(subjectName, currentSemKey) {
  const SEMESTER_LABELS = { '1-1': '1학년 1학기', '1-2': '1학년 2학기',
                            '2-1': '2학년 1학기', '2-2': '2학년 2학기',
                            '3-1': '3학년 1학기', '3-2': '3학년 2학기' };
  
  if (!state.curriculumData || !state.curriculumData.semesters) return null;
  
  for (const [semKey, semData] of Object.entries(state.curriculumData.semesters)) {
    if (semKey === currentSemKey) continue;  // 현재 학기는 제외
    
    // 학교지정 과목 검사 (학생이 클릭 안 했어도 이미 듣게 되어있음)
    if (semData.fixed && semData.fixed.some(s => s.name === subjectName)) {
      return { semKey, semLabel: SEMESTER_LABELS[semKey] || semKey, source: 'fixed' };
    }
    
    // 학생이 다른 학기에서 선택한 과목 검사
    const sel = state.selections[semKey];
    if (sel && sel.choices) {
      for (const choices of Object.values(sel.choices)) {
        if (choices.includes(subjectName)) {
          return { semKey, semLabel: SEMESTER_LABELS[semKey] || semKey, source: 'chosen' };
        }
      }
    }
  }
  return null;
}

}

// === Step 2~7: 학기 선택 ===
function renderSemesterStep(sem) {
  const semData = state.curriculumData.semesters[sem.key];
  if (!semData) {
    return '<div class="error-screen"><h2>이 학기 데이터가 없어요</h2></div>';
  }
  
  // 자동 선택 초기화 (학교지정은 자동 체크)
  if (!state.selections[sem.key]) {
    state.selections[sem.key] = {
      fixed: semData.fixed.map(s => s.name),
      choices: {},  // groupName → [subjectName, ...]
    };
    for (const groupName of Object.keys(semData.choiceGroups)) {
      state.selections[sem.key].choices[groupName] = [];
    }
  }
  
  // 학교지정 영역
  const fixedHtml = semData.fixed.length > 0 ? `
    <div class="section-block">
      <div class="section-header">
        <span class="section-badge fixed">학교 지정</span>
        <span class="section-info">자동으로 들어가는 필수 과목이에요</span>
      </div>
      <div class="subject-list">
        ${semData.fixed.map(s => renderSubjectCard(s, true, sem.key)).join('')}
      </div>
    </div>
  ` : '';
  
  // 학생선택 영역 (그룹별)
  const choiceGroupNames = Object.keys(semData.choiceGroups);
  const choicesHtml = choiceGroupNames.map(groupName => {
    const group = semData.choiceGroups[groupName];
    const selected = state.selections[sem.key].choices[groupName] || [];
    const takeN = group.takeN;
    const takeMin = group.takeMin;
    const takeMax = group.takeMax;
    const takeCredit = group.takeCredit;
    
    // 그룹의 모든 과목이 "희망자만"인지 확인 (송촌고 선택군D, I 패턴)
    // "선택 안함" 가상 옵션 활성화 조건
    const allOptional = group.subjects.length > 0 && group.subjects.every(s => s.optional);
    const isOptIn = allOptional;  // 선택적 그룹 (선택 안 해도 됨)
    
    // "선택 안함" 가상 옵션 선택 여부
    const SKIP_KEY = '__SKIP__';
    const isSkipped = selected.includes(SKIP_KEY);
    
    // 실제 선택된 과목 (가상 옵션 제외)
    const realSelected = selected.filter(name => name !== SKIP_KEY);
    
    // 선택된 과목들의 학점 합계
    const selectedCredits = realSelected.reduce((sum, name) => {
      const s = group.subjects.find(x => x.name === name);
      return sum + (s ? s.credit : 0);
    }, 0);
    
    // 그룹 안내 문구
    let groupGuide = '';
    if (takeMin !== null && takeMax !== null && takeCredit !== null) {
      // 패턴 3: 이문고 선택군C/D - 범위 + 학점 합계
      groupGuide = `${takeMin}~${takeMax}과목을 골라 학점 합계가 정확히 ${takeCredit}학점이 되도록 해주세요`;
    } else if (isOptIn) {
      // 송촌고 패턴: 희망자만 - 선택해도 되고 안 해도 됨
      groupGuide = takeN !== null 
        ? `원하는 학생만 ${takeN}과목을 골라주세요 (선택 안 해도 돼요)`
        : '원하는 학생만 골라주세요 (선택 안 해도 돼요)';
    } else if (takeN !== null) {
      groupGuide = `${takeN}과목을 골라주세요`;
    } else {
      groupGuide = '원하는 과목을 골라주세요';
    }
    
    // 상태 계산
    let statusClass = '';
    let statusText = '';
    let statusDetail = '';
    
    if (isOptIn && isSkipped) {
      // 선택 안함 선택
      statusClass = 'complete';
      statusText = '✓ 선택 안 함';
      statusDetail = `<span class="selected-count">선택 안 함</span> ${statusText}`;
    } else if (takeMin !== null && takeMax !== null && takeCredit !== null) {
      // 이문고 패턴: 개수 + 학점 합계 둘 다 만족
      const countOk = realSelected.length >= takeMin && realSelected.length <= takeMax;
      const creditOk = selectedCredits === takeCredit;
      
      if (realSelected.length > takeMax) {
        statusClass = 'over';
        statusText = '⚠ 너무 많이 선택';
      } else if (countOk && creditOk) {
        statusClass = 'complete';
        statusText = '✓ 완료';
      } else if (countOk && selectedCredits > takeCredit) {
        statusClass = 'over';
        statusText = `⚠ 학점 초과`;
      } else if (countOk && selectedCredits < takeCredit) {
        statusClass = 'partial';
        statusText = `학점 ${takeCredit - selectedCredits} 부족`;
      }
      
      statusDetail = `<span class="selected-count">${realSelected.length}</span>과목 / ${selectedCredits}학점 (목표: ${takeMin}~${takeMax}과목 ${takeCredit}학점)`;
    } else if (takeN !== null) {
      if (realSelected.length === takeN) {
        statusClass = 'complete';
        statusText = '✓ 완료';
      } else if (realSelected.length > takeN) {
        statusClass = 'over';
        statusText = '⚠ 너무 많이 선택';
      } else if (isOptIn && realSelected.length === 0) {
        statusText = '미선택';
      }
      statusDetail = `<span class="selected-count">${realSelected.length}</span>/${takeN} 선택됨 ${statusText}`;
    } else {
      statusDetail = `<span class="selected-count">${realSelected.length}</span>개 선택됨`;
    }
    
    // 가상 옵션: "추가 과목 선택 안함" (선택군D/I 같은 희망자만 그룹에서만 표시)
    const skipOptionHtml = isOptIn ? `
      <div class="subject-card skip-option ${isSkipped ? 'selected' : ''}"
           data-subject="${SKIP_KEY}"
           data-group="${groupName}"
           data-fixed="false"
           data-area=""
           data-credit="0">
        <div class="subject-main">
          <div class="subject-checkbox">${ICONS.check}</div>
          <div class="subject-info">
            <div class="subject-row1">
              <span class="subject-name">추가 과목 선택 안함</span>
            </div>
            <div class="subject-row2">
              <span class="subject-tag tag-skip">선택 안 함</span>
            </div>
          </div>
          <div class="subject-credits">0학점</div>
        </div>
      </div>
    ` : '';
    
    return `
      <div class="choice-group${isOptIn ? ' opt-in-group' : ''}">
        <div class="choice-group-header">
          <div class="choice-group-title">
            <span class="section-badge choice">${groupName}</span>
            ${groupGuide}
          </div>
          <div class="choice-group-status ${statusClass}">
            ${statusDetail}
          </div>
        </div>
        <div class="subject-list">
          ${skipOptionHtml}
          ${group.subjects.map(s => renderSubjectCard(s, false, sem.key, groupName)).join('')}
        </div>
      </div>
    `;
  }).join('');
  
  // 총 학점 계산
  const totalCredit = calculateSemesterCredit(sem.key);
  
  // === 실시간 검증 ===
  const validation = validateSemester(sem.key, state, state.curriculumData);
  const effective = getEffectiveTargets(state, state.curriculumData);
  const target = effective.semesterTargets[sem.key] || 0;
  const hasViolation = !validation.ok;
  
  // 학기 학점 상태 표시
  let creditStatusClass = '';
  let creditStatusHTML = `${totalCredit} 학점`;
  if (target > 0) {
    if (totalCredit === target) {
      creditStatusClass = 'complete';
      creditStatusHTML = `${totalCredit} / ${target} 학점 ✓`;
    } else if (totalCredit > target) {
      creditStatusClass = 'error';
      creditStatusHTML = `${totalCredit} / ${target} 학점 (${totalCredit - target} 초과)`;
    } else {
      creditStatusHTML = `${totalCredit} / ${target} 학점 (${target - totalCredit} 부족)`;
    }
  }
  
  // 검증 경고 박스 HTML
  const alertHtml = hasViolation ? `
    <div class="validation-alert">
      <div class="alert-icon">!</div>
      <div class="alert-content">
        <div class="alert-title">다음 학기로 넘어가기 전에 확인해주세요</div>
        ${validation.errors.map(e => `<div class="alert-msg">• ${e.message}</div>`).join('')}
      </div>
    </div>
  ` : '';
  
  // 학생선택 영역이 없으면
  const noChoicesHtml = choiceGroupNames.length === 0 ? `
    <div class="section-block">
      <div class="section-header">
        <span class="section-badge fixed">참고</span>
        <span class="section-info">이 학기는 모두 학교지정 과목으로 채워져 있어요</span>
      </div>
    </div>
  ` : '';
  
  return `
    <div class="step-card">
      <div class="step-title">
        <div class="step-icon-wrap">${ICONS.semester}</div>
        <span>${sem.label}을 채워볼까요?</span>
      </div>
      <div class="step-desc">
        ${semData.fixed.length > 0 ? '학교지정 과목은 자동으로 체크되어 있어요. ' : ''}
        ${choiceGroupNames.length > 0 ? '학생선택 영역에서 원하는 과목을 골라주세요.' : ''}
      </div>
      
      <div class="semester-summary">
        <div>현재 ${sem.label} 학점</div>
        <div class="credit-status ${creditStatusClass}">${creditStatusHTML}</div>
      </div>
      
      ${alertHtml}
      ${fixedHtml}
      ${choicesHtml}
      ${noChoicesHtml}
      
      <div class="nav-buttons">
        <button class="nav-btn prev" id="prevBtn">
          ${ICONS.arrowLeft} 이전
        </button>
        <button class="nav-btn next" id="nextBtn" ${hasViolation ? 'disabled' : ''}>
          ${state.currentStep === 7 ? '결과 보기' : '다음 학기로'} ${ICONS.arrowRight}
        </button>
      </div>
    </div>
  `;
}

function renderSubjectCard(subj, isFixed, semKey, groupName = null) {
  const recommended = isRecommended(subj.name, subj.area, semKey);
  const suneung = isSuneung(subj.name);
  const description = getSubjectDescription(subj.name);
  const isExpanded = state.expandedSubjects.has(`${semKey}-${subj.name}`);
  const isSelected = isFixed || (groupName && (state.selections[semKey]?.choices[groupName] || []).includes(subj.name));
  
  // 다른 학기에 같은 이름의 과목이 있는지 (학교지정 또는 학생선택)
  // 학생선택 과목 중 이미 선택된 게 아닐 때만 검사 (현재 카드 본인은 제외)
  const dupInfo = (!isFixed && !isSelected) ? findDuplicateSemester(subj.name, semKey) : null;
  
  const typeShort = subj.type.replace('과목', '').replace('선택', '').trim();
  const typeClass = subj.type.includes('공통') ? '공통' : 
                    subj.type.includes('진로') ? '진로' :
                    subj.type.includes('융합') ? '융합' : '일반';
  
  return `
    <div class="subject-card ${isFixed ? 'fixed' : ''} ${isSelected ? 'selected' : ''} ${recommended ? 'recommended' : ''} ${dupInfo ? 'duplicate' : ''}" 
         data-subject="${subj.name}" 
         data-group="${groupName || ''}" 
         data-fixed="${isFixed}"
         data-area="${classifyArea(subj.area)}"
         data-credit="${subj.credit}">
      <div class="subject-main">
        <div class="subject-checkbox">${ICONS.check}</div>
        <div class="subject-info">
          <div class="subject-row1">
            <span class="subject-name">${subj.name}</span>
            ${suneung ? '<span class="subject-suneung-mark">📝 수능출제과목</span>' : ''}
            ${recommended ? '<span class="subject-recommend-mark">⭐ 추천</span>' : ''}
            ${dupInfo ? `<span class="subject-duplicate-mark">⚠️ ${dupInfo.semLabel}에 ${dupInfo.source === 'fixed' ? '편성됨' : '선택함'}</span>` : ''}
          </div>
          <div class="subject-row2">
            ${subj.area ? `<span class="subject-tag">${subj.area}</span>` : ''}
            ${subj.type ? `<span class="subject-tag ${typeClass}">${subj.type}</span>` : ''}
            ${subj.crossSem ? '<span class="subject-tag">학기교차</span>' : ''}
            ${subj.optional ? '<span class="subject-tag tag-optional">희망자만</span>' : ''}
          </div>
        </div>
        <div class="subject-credits">${subj.credit}학점</div>
        ${description !== null || true ? `
          <button class="subject-toggle ${isExpanded ? 'open' : ''}" data-toggle="${semKey}-${subj.name}">
            ${ICONS.chevron}
          </button>
        ` : ''}
      </div>
      <div class="subject-detail ${isExpanded ? 'open' : ''}">
        ${description ? description : '<span class="subject-detail-empty">이 과목의 상세 설명이 아직 등록되지 않았어요.</span>'}
      </div>
    </div>
  `;
}

function bindSemesterEvents(sem) {
  // 과목 카드 클릭 (체크/언체크)
  document.querySelectorAll('.subject-card').forEach(card => {
    const main = card.querySelector('.subject-main');
    const isFixed = card.dataset.fixed === 'true';
    const subjectName = card.dataset.subject;
    const groupName = card.dataset.group;
    
    main.addEventListener('click', (e) => {
      // 토글 버튼 클릭은 제외
      if (e.target.closest('.subject-toggle')) return;
      
      if (isFixed) return;  // 학교지정은 토글 불가
      if (!groupName) return;
      
      const SKIP_KEY = '__SKIP__';
      const choices = state.selections[sem.key].choices[groupName];
      const idx = choices.indexOf(subjectName);
      
      if (subjectName === SKIP_KEY) {
        // === "선택 안함" 가상 옵션 클릭 ===
        if (idx >= 0) {
          // 이미 선택됨 → 해제
          choices.splice(idx, 1);
        } else {
          // 새로 선택 → 그 그룹의 다른 모든 선택 해제 + SKIP_KEY 추가
          choices.length = 0;
          choices.push(SKIP_KEY);
        }
      } else if (idx >= 0) {
        // 일반 과목 해제
        choices.splice(idx, 1);
      } else {
        // === 일반 과목 선택 ===
        // SKIP_KEY가 선택되어 있으면 자동 해제
        const skipIdx = choices.indexOf(SKIP_KEY);
        if (skipIdx >= 0) {
          choices.splice(skipIdx, 1);
        }
        
        // === 동일 과목 중복 선택 차단 ===
        // (다른 학기에 같은 이름의 과목이 학교지정/학생선택으로 있는지)
        const dupInfo = findDuplicateSemester(subjectName, sem.key);
        if (dupInfo) {
          showDuplicateAlert(card, subjectName, dupInfo);
          return;
        }
        
        // === 선택군 한도 초과 차단 ===
        const semData = state.curriculumData.semesters[sem.key];
        const group = semData.choiceGroups[groupName];
        const subjectCredit = parseFloat(card.dataset.credit) || 0;
        const realChoiceCount = choices.filter(n => n !== SKIP_KEY).length;
        
        if (group) {
          // 패턴 3 (이문고): takeMax + takeCredit 둘 다 체크
          if (group.takeMax !== null && group.takeMax !== undefined && realChoiceCount >= group.takeMax) {
            showLimitAlert(groupName, group.takeMax);
            return;
          }
          // 학점 합계 초과 차단 (이문고 선택군C/D)
          if (group.takeCredit !== null && group.takeCredit !== undefined) {
            const currentCredits = choices.reduce((sum, name) => {
              if (name === SKIP_KEY) return sum;
              const s = group.subjects.find(x => x.name === name);
              return sum + (s ? s.credit : 0);
            }, 0);
            if (currentCredits + subjectCredit > group.takeCredit) {
              showCreditLimitAlert(card, groupName, currentCredits + subjectCredit, group.takeCredit);
              return;
            }
          }
          // 패턴 1: 단순 takeN 체크 (takeMax 없는 경우)
          if (group.takeN !== null && (group.takeMax === null || group.takeMax === undefined) 
              && realChoiceCount >= group.takeN) {
            showLimitAlert(groupName, group.takeN);
            return;
          }
        }
        
        // === 국·수·영 상한 초과 차단 ===
        const subjectArea = card.dataset.area;
        if (subjectArea === '국어' || subjectArea === '수학' || subjectArea === '영어') {
          const stats = computeStats(state, state.curriculumData);
          const effective = getEffectiveTargets(state, state.curriculumData);
          const currentKME = stats.areaCredits['국어'] + stats.areaCredits['수학'] + stats.areaCredits['영어'];
          const kmeMax = calcKMECapacity(effective.totalCurriculumCredits);
          if (currentKME + subjectCredit > kmeMax) {
            showKMEAlert(card, currentKME + subjectCredit, kmeMax);
            return;
          }
        }
        
        choices.push(subjectName);
      }
      
      // 저장 + 다시 렌더 (스크롤 위치 보존)
      saveState();
      renderStep(false);
    });
  });
  
  // 설명 토글 버튼
  document.querySelectorAll('.subject-toggle').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      const key = btn.dataset.toggle;
      if (state.expandedSubjects.has(key)) {
        state.expandedSubjects.delete(key);
        btn.classList.remove('open');
        btn.closest('.subject-card').querySelector('.subject-detail').classList.remove('open');
      } else {
        state.expandedSubjects.add(key);
        btn.classList.add('open');
        btn.closest('.subject-card').querySelector('.subject-detail').classList.add('open');
      }
    });
  });
  
  // 이전 버튼
  document.getElementById('prevBtn').addEventListener('click', () => {
    state.currentStep--;
    saveState();
    renderStep();
  });
  
  // 다음 버튼
  document.getElementById('nextBtn').addEventListener('click', () => {
    state.currentStep++;
    saveState();
    renderStep();
  });
}

function calculateSemesterCredit(semKey) {
  const sel = state.selections[semKey];
  if (!sel) return 0;
  
  const semData = state.curriculumData.semesters[semKey];
  let total = 0;
  
  // 학교지정
  for (const subj of semData.fixed) {
    total += subj.credit;
  }
  
  // 학생선택
  for (const [groupName, selectedNames] of Object.entries(sel.choices)) {
    const group = semData.choiceGroups[groupName];
    if (!group) continue;
    for (const name of selectedNames) {
      const subj = group.subjects.find(s => s.name === name);
      if (subj) total += subj.credit;
    }
  }
  
  return total;
}

// === Step 8: 결과 ===
function renderResultStep() {
  // 모든 학기의 선택 과목 정리
  const allSelections = [];
  let totalCredit = 0;
  
  // 📊 GA4 이벤트: 시뮬레이터 완료 (8단계 도달, 핵심 지표!)
  if (typeof gtag === 'function') {
    gtag('event', 'simulator_completed', {
      'school_name': SCHOOL_NAME || '미지정',
      'career': state.career || '미선택'
    });
  }
  
  for (const sem of SEMESTERS) {
    const sel = state.selections[sem.key];
    if (!sel) continue;
    const semData = state.curriculumData.semesters[sem.key];
    
    // 학교지정
    for (const subj of semData.fixed) {
      allSelections.push({ ...subj, semester: sem.key, isFixed: true });
      totalCredit += subj.credit;
    }
    // 학생선택
    for (const [groupName, names] of Object.entries(sel.choices)) {
      const group = semData.choiceGroups[groupName];
      if (!group) continue;
      for (const name of names) {
        const subj = group.subjects.find(s => s.name === name);
        if (subj) {
          allSelections.push({ ...subj, semester: sem.key, isFixed: false, groupName });
          totalCredit += subj.credit;
        }
      }
    }
  }
  
  // 학기별 그룹화
  const bySem = {};
  for (const s of allSelections) {
    if (!bySem[s.semester]) bySem[s.semester] = [];
    bySem[s.semester].push(s);
  }
  
  // 학기별 학점
  const semCredits = {};
  for (const sem of SEMESTERS) {
    semCredits[sem.key] = (bySem[sem.key] || []).reduce((s, x) => s + x.credit, 0);
  }
  
  // === 종합 점검 ===
  const validation = validateAll(state, state.curriculumData);
  const allPassed = validation.failed.length === 0;
  const isExcluded = validation.schoolCategory === 'excluded';
  
  // 점검 안내 (학교 유형 표시)
  let categoryLabel = '';
  if (validation.schoolCategory === 'general') categoryLabel = '일반 고등학교 기준';
  else if (validation.schoolCategory === 'autonomous') categoryLabel = '자율/특수목적 고등학교 기준 (완화 규정 적용)';
  else categoryLabel = '점검 대상 외 학교';
  
  const validationHtml = isExcluded ? '' : `
    <div class="validation-section ${allPassed ? 'all-passed' : 'has-failed'}">
      <div class="v-title">
        ${allPassed 
          ? '✓ 모든 점검 항목 통과!' 
          : `⚠ ${validation.failed.length}개 항목 검토가 필요해요`}
      </div>
      <div class="v-subtitle">
        대전광역시 고등학교 교육과정 편성·운영 지침 (고시 제2024-15호) 기준 · ${categoryLabel}
      </div>
      <div class="check-list">
        ${validation.checks.map(c => `
          <div class="check-item ${c.passed ? 'passed' : 'failed'}">
            <div class="check-icon">${c.passed ? '✓' : '!'}</div>
            <div class="check-info">
              <div class="check-title">${c.title}</div>
              <div class="check-detail">${c.detail}</div>
            </div>
          </div>
        `).join('')}
      </div>
    </div>
  `;
  
  // 공유 링크로 접속한 경우 안내 배너
  const sharedBannerHtml = state.fromShare ? `
    <div class="shared-banner">
      <div class="banner-icon">🔗</div>
      <div class="banner-content">
        <div class="banner-title">공유받은 결과를 보고 계세요</div>
        <div>이 화면은 누군가가 공유한 과목 선택 결과예요. 직접 시뮬레이션 해보고 싶다면 아래를 눌러주세요.</div>
        <div class="banner-action">
          <button onclick="startFresh()">처음부터 시작하기</button>
        </div>
      </div>
    </div>
  ` : '';
  
  return `
    <div class="step-card">
      <div class="step-title">
        <div class="step-icon-wrap">${ICONS.result}</div>
        <span>완성! 나의 3년 교육과정</span>
      </div>
      
      ${sharedBannerHtml}
      ${validationHtml}
      
      <!-- 캡쳐 대상 영역 -->
