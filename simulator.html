function bindResultEvents() {
  // 보기 전용 모드: "나도 해보기" 버튼만 활성화하고 끝
  if (IS_VIEW_ONLY) {
    const goMyBtn = document.getElementById('goMySimBtn');
    if (goMyBtn) {
      goMyBtn.addEventListener('click', () => {
        // 보기 전용 파라미터(s, view) 제거하고 처음부터 시작 (이 학교 그대로)
        const baseUrl = window.location.origin + window.location.pathname;
        const params = new URLSearchParams();
        params.set('school', SCHOOL_NAME);
        params.set('sheetId', SHEET_ID);
        if (IS_EMBED) params.set('embed', '1');
        window.location.href = `${baseUrl}?${params.toString()}`;
      });
    }
    return;  // 다른 버튼들은 존재하지 않음
  }
  
  document.getElementById('prevBtn').addEventListener('click', () => {
    state.currentStep--;
    saveState();
    renderStep();
  });
  
  document.getElementById('printBtn').addEventListener('click', () => {
    window.print();
  });
  
  document.getElementById('resetBtn').addEventListener('click', () => {
    if (confirm('지금까지의 선택을 모두 초기화하고 처음부터 다시 시작할까요?')) {
      state.currentStep = 1;
      state.career = null;
      state.selections = {};
      state.expandedSubjects.clear();
      saveState();
      renderStep();
    }
  });
  
  document.getElementById('homeBtn').addEventListener('click', goHome);
  
  // === 공유 버튼들 ===
  const shareBtn = document.getElementById('shareBtn');
  const saveImageBtn = document.getElementById('saveImageBtn');
  const copyLinkBtn = document.getElementById('copyLinkBtn');
  
  if (shareBtn) shareBtn.addEventListener('click', shareResult);
  if (saveImageBtn) saveImageBtn.addEventListener('click', saveAsImage);
  if (copyLinkBtn) copyLinkBtn.addEventListener('click', copyShareLink);
  
  // === 공유 모달 이벤트 ===
  const shareModalOverlay = document.getElementById('shareModalOverlay');
  const shareModalClose = document.getElementById('shareModalClose');
  
  // 모달 닫기 버튼
  if (shareModalClose) {
    shareModalClose.addEventListener('click', closeShareModal);
  }
  
  // 모달 배경 클릭 시 닫기
  if (shareModalOverlay) {
    shareModalOverlay.addEventListener('click', (e) => {
      if (e.target === shareModalOverlay) closeShareModal();
    });
  }
  
  // SNS 버튼들 (이벤트 위임)
  document.querySelectorAll('.share-modal-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const sns = btn.dataset.sns;
      if (sns) handleSnsShare(sns);
    });
  });
  
  // ESC 키로 모달 닫기
  document.addEventListener('keydown', function escHandler(e) {
    if (e.key === 'Escape' && shareModalOverlay && shareModalOverlay.classList.contains('active')) {
      closeShareModal();
    }
  });
}

function showShareHint(message, type = 'success') {
  const hint = document.getElementById('shareHint');
  if (!hint) return;
  hint.textContent = message;
  hint.className = 'share-hint ' + type;
  setTimeout(() => {
    if (hint.textContent === message) {
      hint.textContent = '';
      hint.className = 'share-hint';
    }
  }, 4000);
}

// 결과를 캔버스로 그려서 Blob으로 반환
async function generateShareImage() {
  const target = document.getElementById('shareableContent');
  if (!target) throw new Error('공유할 내용을 찾을 수 없어요');
  if (typeof html2canvas === 'undefined') throw new Error('이미지 생성 도구를 불러오지 못했어요');
  
  // 캔버스 생성 (모바일 화면 너비 고정)
  const canvas = await html2canvas(target, {
    backgroundColor: '#FFFFFF',
    scale: 2,  // 고화질
    useCORS: true,
    logging: false,
  });
  
  return new Promise((resolve, reject) => {
    canvas.toBlob((blob) => {
      if (blob) resolve(blob);
      else reject(new Error('이미지 변환 실패'));
    }, 'image/png');
  });
}

// === URL 단축 (is.gd 무료 API) ===
// 긴 시뮬레이터 결과 URL을 짧게 만들어 카톡/SMS 등에서 깔끔하게 표시
async function shortenUrl(longUrl) {
  console.log('[단축] 원본 URL 길이:', longUrl.length);
  
  // 1) is.gd 시도
  try {
    console.log('[단축] is.gd 시도 중...');
    const apiUrl = `https://is.gd/create.php?format=json&url=${encodeURIComponent(longUrl)}`;
    const response = await fetch(apiUrl);
    console.log('[단축] is.gd 응답 status:', response.status);
    
    if (response.ok) {
      const data = await response.json();
      console.log('[단축] is.gd 응답:', data);
      if (data.shorturl) {
        console.log('[단축] is.gd 성공:', data.shorturl);
        return data.shorturl;
      }
      console.warn('[단축] is.gd 에러:', data.errormessage);
    }
  } catch (err) {
    console.warn('[단축] is.gd 실패:', err.message);
  }
  
  // 2) TinyURL 시도 (is.gd 실패 시 폴백)
  try {
    console.log('[단축] TinyURL 시도 중...');
    const apiUrl = `https://tinyurl.com/api-create.php?url=${encodeURIComponent(longUrl)}`;
    const response = await fetch(apiUrl);
    console.log('[단축] TinyURL 응답 status:', response.status);
    
    if (response.ok) {
      const text = await response.text();
      if (text && text.startsWith('https://tinyurl.com/')) {
        console.log('[단축] TinyURL 성공:', text);
        return text.trim();
      }
    }
  } catch (err) {
    console.warn('[단축] TinyURL 실패:', err.message);
  }
  
  // 3) 모두 실패: 원본 반환
  console.warn('[단축] 모든 단축 서비스 실패. 원본 URL 사용');
  return longUrl;
}

// 1) 공유하기 - 카카오톡 우선 (피드 메시지 카드), 폴백으로 Web Share API
// === 1) 공유하기 버튼 → 모달 띄우기 ===
function shareResult(e) {
  // 이벤트 기본 동작 + 전파 차단 (삼성 인터넷 등에서 자동 공유 시트 띄우는 동작 차단)
  if (e) {
    e.preventDefault();
    e.stopPropagation();
    if (e.stopImmediatePropagation) e.stopImmediatePropagation();
  }
  
  const modal = document.getElementById('shareModalOverlay');
  if (modal) {
    modal.classList.add('active');
  }
  
  return false;
}

// === 공유 모달 닫기 ===
function closeShareModal() {
  const modal = document.getElementById('shareModalOverlay');
  if (modal) {
    modal.classList.remove('active');
  }
}

// === SNS별 공유 핸들러 ===
async function handleSnsShare(sns) {
  // 공통 데이터 준비
  const longUrl = buildShareableUrl();
  const shortUrl = await shortenUrl(longUrl);
  const shareTitle = `${SCHOOL_NAME}등학교 - ${state.career} 진로`;
  const shareDescription = `${SCHOOL_NAME}등학교의 과목 선택 시뮬레이터로 3년 교육과정을 설계해봤어요. 결과를 확인해보세요!`;
  const trySimUrl = `${window.location.origin}${window.location.pathname}?school=${encodeURIComponent(SCHOOL_NAME)}&sheetId=${SHEET_ID}&fresh=1`;
  
  // 환경 감지
  const isSamsungBrowser = /SamsungBrowser/i.test(navigator.userAgent);
  
  switch (sns) {
    case 'kakao': {
      // 카카오톡: SDK 미리보기 카드 (삼성 인터넷에선 Web Share API 폴백)
      const useKakaoSDK = !isSamsungBrowser
                       && typeof Kakao !== 'undefined'
                       && Kakao.isInitialized()
                       && Kakao.Share;
      
      if (useKakaoSDK) {
        try {
          Kakao.Share.sendDefault({
            objectType: 'feed',
            content: {
              title: shareTitle,
              description: shareDescription,
              imageUrl: 'https://djhs-curriculum.kro.kr/og-image.png',
              imageWidth: 1200,
              imageHeight: 630,
              // 메인 카드 클릭 시 이동 URL (원본 긴 URL - query string 보존)
              link: { mobileWebUrl: longUrl, webUrl: longUrl },
            },
            buttons: [
              // 결과 확인하기 버튼이 먼저 (위쪽에 표시)
              { title: '결과 확인하기', link: { mobileWebUrl: longUrl, webUrl: longUrl } },
              // 나도 해보기 버튼 (좌우 나란히 표시됨)
              { title: '나도 해보기', link: { mobileWebUrl: trySimUrl, webUrl: trySimUrl } },
            ],
          });
          closeShareModal();
        } catch (e) {
          console.error('Kakao SDK 실패, Web Share API 폴백:', e);
          fallbackToWebShare(shareTitle, shortUrl);
        }
      } else {
        // 삼성 인터넷 등: Web Share API로 폴백
        fallbackToWebShare(shareTitle, shortUrl);
      }
      break;
    }
    
    case 'instagram': {
      // 인스타그램은 직접 URL 공유 API 없음
      // → 링크를 클립보드에 복사 + 인스타그램 앱 열기 시도 + 안내
      try {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          await navigator.clipboard.writeText(shortUrl);
        }
      } catch (e) {}
      
      // 모바일이면 인스타그램 앱 열기 시도 (스토리/DM 자동 열기는 불가)
      const isMobile = /Mobile|Android|iPhone|iPad/i.test(navigator.userAgent);
      if (isMobile) {
        // 인스타그램 앱 직접 열기 (스토리 카메라)
        window.location.href = 'instagram://story-camera';
        // 앱이 없으면 웹으로 폴백 (1초 후)
        setTimeout(() => {
          window.open('https://www.instagram.com/', '_blank');
        }, 1500);
      } else {
        window.open('https://www.instagram.com/', '_blank');
      }
      
      showShareHint('링크가 복사됐어요! 인스타그램 스토리나 DM에 붙여넣어주세요.', 'success');
      closeShareModal();
      break;
    }
    
    case 'twitter': {
      // X (트위터): 인텐트 URL
      const text = encodeURIComponent(`${shareTitle}\n${shareDescription}`);
      const url = encodeURIComponent(shortUrl);
      window.open(`https://twitter.com/intent/tweet?text=${text}&url=${url}`, '_blank');
      closeShareModal();
      break;
    }
    
    case 'sms': {
      // 문자메시지: sms: 스킴
      const body = encodeURIComponent(`${shareTitle}\n${shortUrl}`);
      window.location.href = `sms:?body=${body}`;
      closeShareModal();
      break;
    }
    
    case 'other': {
      // 다른 앱 (OS 공유 시트 - Web Share API)
      fallbackToWebShare(shareTitle, shortUrl);
      closeShareModal();
      break;
    }
  }
}

// Web Share API 폴백 함수
async function fallbackToWebShare(title, url) {
  if (navigator.share) {
    try {
      await navigator.share({ title, url });
    } catch (err) {
      if (err.name !== 'AbortError') {
        console.warn('Web Share API 실패:', err);
        // 마지막 폴백: 클립보드
        try {
          if (navigator.clipboard && navigator.clipboard.writeText) {
            await navigator.clipboard.writeText(url);
            showShareHint('링크가 복사됐어요! 카카오톡 등에 붙여넣어주세요.', 'success');
          }
        } catch (e) {}
      }
    }
  } else {
    // Web Share API 미지원: 클립보드 폴백
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        await navigator.clipboard.writeText(url);
        showShareHint('이 환경에서는 자동 공유가 안 돼요. 링크가 복사됐어요!', 'success');
      }
    } catch (e) {
      showShareHint('이 환경에서는 자동 공유가 안 돼요.', 'error');
    }
  }
}

// 2) 이미지로 저장
async function saveAsImage() {
  const btn = document.getElementById('saveImageBtn');
  if (!btn) return;
  btn.disabled = true;
  showShareHint('이미지 생성 중...');
  
  try {
    const blob = await generateShareImage();
    const filename = `${SCHOOL_NAME}_과목선택_${new Date().toISOString().slice(0, 10)}.png`;
    downloadBlob(blob, filename);
    showShareHint('이미지가 저장됐어요!', 'success');
  } catch (err) {
    console.error('이미지 저장 실패:', err);
    showShareHint('이미지 저장 중 문제가 생겼어요.', 'error');
  } finally {
    btn.disabled = false;
  }
}

// 3) 링크 복사
// === 공유용 URL 생성 (LZ-string 압축, 보기 전용 모드) ===
function buildShareableUrl() {
  // 현재 URL의 origin + path만 가져오기 (기존 쿼리 파라미터 제거)
  const baseUrl = window.location.origin + window.location.pathname;
  const params = new URLSearchParams();
  params.set('school', SCHOOL_NAME);
  params.set('sheetId', SHEET_ID);
  params.set('view', '1');  // 보기 전용 모드 (수정 불가)
  
  // 상태를 JSON으로
  const shareState = {
    career: state.career,
    selections: state.selections,
    step: 8,
  };
  try {
    const json = JSON.stringify(shareState);
    // LZ-string 압축 (URL-safe Base64로) - 일반 Base64보다 60-80% 짧음
    let encoded;
    if (typeof LZString !== 'undefined' && LZString.compressToEncodedURIComponent) {
      encoded = LZString.compressToEncodedURIComponent(json);
      params.set('c', encoded);  // 'c' = compressed
    } else {
      // 폴백: 기존 Base64
      encoded = btoa(unescape(encodeURIComponent(json)));
      params.set('s', encoded);
    }
  } catch (e) {
    console.warn('상태 인코딩 실패:', e);
  }
  
  return `${baseUrl}?${params.toString()}`;
}

async function copyShareLink() {
  try {
    // 긴 URL 생성 → is.gd로 단축 시도
    const longUrl = buildShareableUrl();
    const url = await shortenUrl(longUrl);
    
    if (navigator.clipboard && navigator.clipboard.writeText) {
      await navigator.clipboard.writeText(url);
      showShareHint('링크가 복사됐어요!', 'success');
    } else {
      // 폴백: 임시 textarea
      const ta = document.createElement('textarea');
      ta.value = url;
      ta.style.position = 'fixed';
      ta.style.left = '-9999px';
      document.body.appendChild(ta);
      ta.select();
      const ok = document.execCommand('copy');
      document.body.removeChild(ta);
      if (ok) {
        showShareHint('링크가 복사됐어요!', 'success');
      } else {
        showShareHint('복사할 수 없어요. 주소창에서 직접 복사해주세요.', 'error');
      }
    }
  } catch (err) {
    console.error('링크 복사 실패:', err);
    showShareHint('복사 중 문제가 생겼어요.', 'error');
  }
}

function downloadBlob(blob, filename) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

function goHome() {
  if (state.currentStep > 1 && Object.keys(state.selections).length > 0) {
    if (!confirm('나가면 지금까지의 선택이 사라질 수 있어요. 정말 나가시겠어요?')) return;
  }
  
  // localStorage 초기화
  try { localStorage.removeItem(STORAGE_KEY); } catch(e) {}
  
  if (IS_EMBED && window.parent !== window) {
    // 임베드 모달 - 부모창의 모달 닫기 호출
    try {
      window.parent.closeSimulatorModal();
    } catch (e) {
      // 같은 출처가 아니면 폴백
      window.parent.postMessage({ action: 'closeSimulator' }, '*');
    }
  } else {
    window.location.href = 'index.html';
  }
}

// 공유 링크에서 접속한 사용자가 직접 시뮬레이션 시작
function startFresh() {
  // 상태 초기화
  state.currentStep = 1;
  state.career = null;
  state.selections = {};
  state.expandedSubjects.clear();
  state.fromShare = false;
  
  // localStorage 초기화
  try { localStorage.removeItem(STORAGE_KEY); } catch(e) {}
  
  // URL의 공유 파라미터(s) 제거 (학교/시트ID는 유지)
  const newUrl = window.location.origin + window.location.pathname 
    + `?school=${encodeURIComponent(SCHOOL_NAME)}&sheetId=${SHEET_ID}${IS_EMBED ? '&embed=1' : ''}`;
  window.history.replaceState({}, '', newUrl);
  
  renderStep();
}

// ============================================
// localStorage 저장/복원
// ============================================
const STORAGE_KEY = `simulator-${SCHOOL_NAME}`;

function saveState() {
  // 보기 전용 모드(공유 링크)에서는 저장하지 않음 - 받는 사람의 본인 진행 데이터 보호
  if (IS_VIEW_ONLY) return;
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify({
      career: state.career,
      selections: state.selections,
      currentStep: state.currentStep,
    }));
  } catch (e) {}
}

function loadState() {
  try {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (!saved) return;
    const data = JSON.parse(saved);
    state.career = data.career;
    state.selections = data.selections || {};
    state.currentStep = data.currentStep || 1;
  } catch (e) {}
}

// ============================================
// 에러 화면
// ============================================
function showError(title, msg) {
  document.getElementById('stepContent').innerHTML = `
    <div class="error-screen">
      <div class="icon">⚠️</div>
      <h2>${title}</h2>
      <p>${msg}</p>
      <a href="index.html">메인으로 돌아가기</a>
    </div>
  `;
}

// ============================================
// 시작
// ============================================
init();
</script>
