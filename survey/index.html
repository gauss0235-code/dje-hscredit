  <header class="hero">
    <svg class="hero-art" viewBox="0 0 400 300" aria-hidden="true" preserveAspectRatio="xMaxYMin slice">
      <defs>
        <pattern id="dots" width="16" height="16" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" fill="rgba(255,255,255,.16)"/></pattern>
        <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4f7cff" stop-opacity=".55"/><stop offset="1" stop-color="#4f7cff" stop-opacity="0"/></linearGradient>

      <rect x="180" y="0" width="220" height="190" fill="url(#dots)"/>
      <circle cx="340" cy="40" r="120" fill="url(#glow)"/>
      <circle cx="340" cy="40" r="78" fill="none" stroke="rgba(255,255,255,.14)" stroke-width="1.5"/>
      <circle cx="340" cy="40" r="118" fill="none" stroke="rgba(255,255,255,.08)" stroke-width="1.5"/>

    <div class="hero-inner">
      <div class="hero-kicker"><span id="org-name">대전광역시교육청</span><i></i><span id="program-name">공동교육과정</span></div>

      <div class="hero-chips" id="hero-chips"></div>

    <div class="panel center-state"><div class="spinner" aria-hidden="true"></div><p>설문을 불러오는 중…</p></div>

  <footer class="foot" id="foot">

    응답은 익명으로 처리되며 공동교육과정 운영 개선에만 활용됩니다.
  </footer>
