<!doctype html>
<!-- 카카오톡 등 링크 미리보기 이미지(1200x600) 틀. tools/survey_share_pages.py가 __TERM__·__MAIN__을 채우고
     글꼴(__FONTS__)을 넣은 뒤 헤드리스 브라우저로 찍어 survey/<코드>/og-….png로 저장한다. -->
<html lang="ko">
<head>
<meta charset="utf-8">
<style>
  __FONTS__
  html, body { margin: 0; padding: 0; }
  body { width: 1200px; height: 600px; overflow: hidden; font-family: "Paperlogy", "Malgun Gothic", "Noto Sans CJK KR", sans-serif; }
  .card {
    position: relative; width: 1200px; height: 600px; overflow: hidden; color: #fff; box-sizing: border-box;
    background: radial-gradient(120% 140% at 100% 0%, #1d3f8f 0%, #0d2149 55%, #081634 100%);
    padding: 130px 104px 0;
  }
  .art { position: absolute; top: 0; right: 0; width: 760px; height: 600px; }
  .inner { position: relative; }
  .term { margin: 0; font-size: 36px; font-weight: 700; color: #9fb8ff; letter-spacing: -0.01em; }
  .term:empty { display: none; }
  h1 {
    margin: 18px 0 0; width: 992px; white-space: nowrap; overflow: hidden;
    font-size: 96px; font-weight: 800; line-height: 1.12; letter-spacing: -0.035em;
  }
  .sub { margin: 24px 0 0; font-size: 34px; font-weight: 600; color: #c9d7ff; letter-spacing: -0.01em; }
  .chips { display: flex; gap: 14px; margin-top: 46px; }
  .chip {
    display: inline-flex; align-items: center; gap: 10px; height: 58px; padding: 0 26px; border-radius: 999px;
    background: rgba(255,255,255,.1); border: 2px solid rgba(255,255,255,.16); font-size: 26px; font-weight: 700; color: rgba(255,255,255,.94);
  }
  .chip svg { width: 26px; height: 26px; }
</style>
</head>
<body>
<div class="card">
  <svg class="art" viewBox="0 0 400 320" preserveAspectRatio="xMaxYMin slice" aria-hidden="true">
    <defs>
      <pattern id="dots" width="16" height="16" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" fill="rgba(255,255,255,.16)"/></pattern>
      <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4f7cff" stop-opacity=".55"/><stop offset="1" stop-color="#4f7cff" stop-opacity="0"/></linearGradient>
    </defs>
    <rect x="180" y="0" width="220" height="210" fill="url(#dots)"/>
    <circle cx="340" cy="40" r="120" fill="url(#glow)"/>
    <circle cx="340" cy="40" r="78" fill="none" stroke="rgba(255,255,255,.14)" stroke-width="1.5"/>
    <circle cx="340" cy="40" r="118" fill="none" stroke="rgba(255,255,255,.08)" stroke-width="1.5"/>
  </svg>
  <div class="inner">
    <p class="term">__TERM__</p>
    <h1 id="main">__MAIN__</h1>
    <p class="sub">수강한 강좌에 대한 의견을 들려주세요</p>
    <div class="chips">
      <span class="chip"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>익명 응답</span>
      <span class="chip"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>약 2분</span>
      <span class="chip"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="2.5" width="10" height="19" rx="2.5"/><path d="M11 18h2"/></svg>휴대폰으로 참여</span>
    </div>
  </div>
</div>
<script>
  // 큰 제목이 한 줄에 다 들어가도록, 넘치면 글자를 조금씩 줄임
  document.fonts.ready.then(function () {
    var h = document.getElementById("main"), size = 96;
    while (h.scrollWidth > h.clientWidth && size > 44) { size -= 2; h.style.fontSize = size + "px"; }
  });
</script>
</body>
</html>
